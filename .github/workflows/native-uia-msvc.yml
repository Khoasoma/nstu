              $compile.warningDiagnostics = @($buildText -split '\r?\n' | Where-Object { $_ -match '\bwarning\s+[A-Z]+\d+\s*:' })
              $compile.warningDiagnosticLineCount = $compile.warningDiagnostics.Count
              $compile.D9025LineCount = @($compile.warningDiagnostics | Where-Object { $_ -match '\bD9025\b' }).Count
              $compile.zeroWarningDiagnosticLinesObserved = $compile.warningDiagnosticLineCount -eq 0
              $compile.buildLogSha256 = (Get-FileHash -LiteralPath $buildLog -Algorithm SHA256).Hash
            }
            $compile.completedUtc = [DateTime]::UtcNow.ToString('o')
            $compile | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDir 'compile.json') -Encoding utf8
            if ($compile.status -eq 'PASS') {
              $manifest = [ordered]@{ checkoutSha = $inputs.checkoutSha; workflowSha256 = $inputs.workflowSha256
                runId = $inputs.runId; attempt = $inputs.attempt; sourceHashes = $inputs.sourceHashes
                executable = 'msvc-probe/nstu-native-uia-probe.exe'; binary = $compile.binary
                MSVC_COMPILE = 'PASS'; compiler = $compile.compiler; settings = $compile.settings
                translationUnits = $compile.translationUnits; activeAssertionsProof = $compile.activeAssertionsProof
                WindowsSDK = $compile.WindowsSDK; PlatformToolset = $compile.PlatformToolset
                embeddedManifestVerification = $compile.embeddedManifestVerification; embeddedManifest = 'msvc-probe/embedded-manifest.xml'; embeddedManifestReceipt = 'msvc-probe/embedded-manifest-verification.json'
                expectedAssemblyIdentity = $inputs.expectedAssemblyIdentity; assemblyIdentity = $compile.embeddedManifestVerification.extractedAssemblyIdentity
                OS = $compile.OS; UIAutomationCore = $compile.UIAutomationCore; imports = $compile.imports
                warningDiagnosticLineCount = $compile.warningDiagnosticLineCount; warningDiagnostics = $compile.warningDiagnostics
                D9025LineCount = $compile.D9025LineCount; compileReceiptSha256 = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'compile.json') -Algorithm SHA256).Hash
                ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'; ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED' }
              $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDir 'msvc-probe/manifest.json') -Encoding utf8
            }
          }

      - name: Require observed own CI desktop context
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $context = [ordered]@{ status = 'RUNNING'; CI_OWN_WINDOW = 'NOT_RUN'; userInteractive = [Environment]::UserInteractive
            sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId; desktopOpened = $false; desktopError = $null
            desktopClosed = $false; OS = [Environment]::OSVersion.VersionString }
          try {
            Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeProbeCiDesktop {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
            [DllImport("user32.dll", SetLastError=true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool CloseDesktop(IntPtr desktop);
          }
          '@
            $desktop = [NativeProbeCiDesktop]::OpenInputDesktop(0, $false, 1)
            $context.desktopOpened = $desktop -ne [IntPtr]::Zero
            $context.desktopError = if ($context.desktopOpened) { 0 } else { [Runtime.InteropServices.Marshal]::GetLastWin32Error() }
            if ($context.desktopOpened) { $context.desktopClosed = [NativeProbeCiDesktop]::CloseDesktop($desktop) }
            if (-not $context.userInteractive -or $context.sessionId -le 0 -or -not $context.desktopOpened -or -not $context.desktopClosed) {
              throw 'CI own-window context unavailable; runtime unqualified'
            }
            $context.status = 'ELIGIBLE_NOT_QUALIFIED'
          } catch {
            $context.status = 'FAIL'
            $context.CI_OWN_WINDOW = 'NOT_RUN_CONTEXT_REJECTED'
            $context.error = $_.Exception.Message
            throw
          } finally {
            $context | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidenceDir 'context.json') -Encoding utf8
          }

      - name: Verify all ten exact CTest registrations
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $inputs = Get-Content -LiteralPath (Join-Path $evidenceDir 'inputs.json') -Raw | ConvertFrom-Json
          function Read-NativeLockedBytes([string]$path) {
            $stream = [IO.FileStream]::new($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            try {
              $buffer = [IO.MemoryStream]::new()
              try { $stream.CopyTo($buffer); return ,$buffer.ToArray() } finally { $buffer.Dispose() }
            } finally { $stream.Dispose() }
          }
          function Get-NativeByteHash([byte[]]$bytes) {
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          }
          function Convert-NativeUtf8([byte[]]$bytes) {
            $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
            if ($text.Length -and $text[0] -eq [char]0xFEFF) { $text = $text.Substring(1) }
            return $text
          }
          function Write-NativeNewBytes([string]$path, [byte[]]$bytes) {
            $stream = [IO.FileStream]::new($path, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $stream.Write($bytes, 0, $bytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
            $expected = Get-NativeByteHash $bytes
            if ((Get-NativeByteHash (Read-NativeLockedBytes $path)) -cne $expected) { throw 'New evidence copy differs from consumed bytes' }
            return $expected
          }
          function Save-NativeEvidenceSnapshot([string]$source, [string]$destination, [string]$name) {
            $bytes = Read-NativeLockedBytes $source
            $hash = Write-NativeNewBytes $destination $bytes
            return @{ name=$name; source=$source; destination=$destination; sha256=$hash; size=$bytes.Length; bytes=$bytes }
          }

          function Confirm-NativeInventoryOnlyLog([byte[]]$bytes) {
            $text = Convert-NativeUtf8 $bytes
            $format = '\AStart testing: [^\r\n]+\r?\n----------------------------------------------------------\r?\nEnd testing: [^\r\n]+\r?\n\z'
            if (-not [regex]::IsMatch($text,$format)) { throw 'Inventory log contains unexpected/stale execution evidence or malformed framing' }
          }
          function Preserve-NativeInventoryLog([string]$buildDir,[string]$evidenceDir,$receipt) {
            $inventoryDir = Join-Path $evidenceDir 'ctest-inventory'
            $source = Join-Path $buildDir 'Testing/Temporary/LastTest.log'
            $snapshot = Save-NativeEvidenceSnapshot $source (Join-Path $inventoryDir 'LastTest.snapshot.log') 'LastTest.snapshot.log'
            $receipt.inventoryLogSnapshotSha256 = $snapshot.sha256
            $receipt.inventoryLogSnapshotBytes = $snapshot.size
            Confirm-NativeInventoryOnlyLog $snapshot.bytes
            if ((Get-NativeByteHash (Read-NativeLockedBytes $source)) -cne $snapshot.sha256) { throw 'Inventory-generated log changed before preserved transfer' }
            $moved = Join-Path $inventoryDir 'LastTest.moved.log'
            if (Test-Path -LiteralPath $moved) { throw 'Inventory transfer destination already exists' }
            $expectedSource = [IO.Path]::GetFullPath((Join-Path $buildDir 'Testing/Temporary/LastTest.log'))
            $expectedDestination = [IO.Path]::GetFullPath((Join-Path $evidenceDir 'ctest-inventory/LastTest.moved.log'))
            if (-not [string]::Equals([IO.Path]::GetFullPath($source),$expectedSource,[StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals([IO.Path]::GetFullPath($moved),$expectedDestination,[StringComparison]::OrdinalIgnoreCase)) { throw 'Inventory transfer path escaped exact admitted boundary' }
            Move-Item -LiteralPath $source -Destination $moved
            $movedHash = Get-NativeByteHash (Read-NativeLockedBytes $moved)
            $receipt.inventoryLogMovedSha256 = $movedHash
            if ($movedHash -cne $snapshot.sha256 -or (Test-Path -LiteralPath $source)) { throw 'Inventory source transfer drift or original path remains' }
            $receipt.inventoryLogTransferred = $true
          }
          function Confirm-NativeArchivedInventory([string]$evidenceDir,$receipt) {
            if ($receipt.status -cne 'PASS' -or $receipt.inventoryExit -ne 0 -or $receipt.count -ne 10 -or
                $receipt.preInventoryLogAbsent -isnot [bool] -or -not $receipt.preInventoryLogAbsent -or
                $receipt.inventoryLogTransferred -isnot [bool] -or -not $receipt.inventoryLogTransferred) { throw 'Qualified inventory freshness boundary missing' }
            foreach ($entry in @(
                @{path='ctest-inventory/LastTest.snapshot.log';hash=$receipt.inventoryLogSnapshotSha256;inventoryLog=$true},
                @{path='ctest-inventory/LastTest.moved.log';hash=$receipt.inventoryLogMovedSha256;inventoryLog=$true},
                @{path='ctest-inventory/test-inventory.json';hash=$receipt.inventoryJsonSnapshotSha256;inventoryLog=$false},
                @{path='test-inventory.json';hash=$receipt.inventoryJsonSnapshotSha256;inventoryLog=$false})) {
              $bytes = Read-NativeLockedBytes (Join-Path $evidenceDir $entry.path)
              if (-not $entry.hash -or (Get-NativeByteHash $bytes) -cne $entry.hash) { throw 'Qualified inventory preserved/current bytes drifted' }
              if ($entry.inventoryLog) { Confirm-NativeInventoryOnlyLog $bytes }
            }
            if ($receipt.inventoryLogSnapshotSha256 -cne $receipt.inventoryLogMovedSha256) { throw 'Inventory preserved transfer hashes differ' }
          }
          function Confirm-NativePreExecutionInventory([string]$buildDir,[string]$evidenceDir,[string]$manifestHash) {
            $receiptBytes = Read-NativeLockedBytes (Join-Path $evidenceDir 'inventory-check.json')
            $receipt = (Convert-NativeUtf8 $receiptBytes) | ConvertFrom-Json
            Confirm-NativeInventoryPhaseBinding $evidenceDir (Get-NativeByteHash $receiptBytes)
            if ($receipt.embeddedManifestVerificationSha256 -cne $manifestHash) { throw 'Inventory freshness manifest binding differs' }
            Confirm-NativeArchivedInventory $evidenceDir $receipt
            if (Test-Path -LiteralPath (Join-Path $buildDir 'Testing/Temporary/LastTest.log')) { throw 'Unexpected native execution log after qualified inventory transfer' }
            return @{ receipt=$receipt; receiptSha256=(Get-NativeByteHash $receiptBytes) }
          }
          function Write-NativeInventoryPhaseEvidence([string]$evidenceDir,[string]$inventoryDir,[bool]$created,$receipt) {
            $phaseBytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json -Depth 8))
            $phaseHash = Write-NativeNewBytes (Join-Path $evidenceDir 'inventory-check.json') $phaseBytes
            if (-not $created) { return }
            $null = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-receipt.json') $phaseBytes
            $binding = @{ phaseReceiptSha256=$phaseHash; phaseStatus=$receipt.status; archiveHashes=@{
              'LastTest.snapshot.log'=$receipt.inventoryLogSnapshotSha256
              'LastTest.moved.log'=$receipt.inventoryLogMovedSha256
              'test-inventory.json'=$receipt.inventoryJsonSnapshotSha256 } }
            $bindingBytes = [Text.UTF8Encoding]::new($false).GetBytes(($binding | ConvertTo-Json -Depth 8))
            $bindingHash = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-binding.json') $bindingBytes
            $null = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-binding.sha256') ([Text.Encoding]::ASCII.GetBytes($bindingHash+"`n"))
          }
          function Confirm-NativeInventoryPhaseBinding([string]$evidenceDir,[string]$expectedCurrentHash) {
            $directory = Join-Path $evidenceDir 'ctest-inventory'
            $bindingBytes = Read-NativeLockedBytes (Join-Path $directory 'phase-binding.json')
            $digest = Convert-NativeUtf8 (Read-NativeLockedBytes (Join-Path $directory 'phase-binding.sha256'))
            if ($digest -notmatch '\A[0-9A-F]{64}\n\z' -or (Get-NativeByteHash $bindingBytes) -cne $digest.TrimEnd("`n")) { throw 'Inventory phase-binding bytes changed/unbound' }
            $binding = (Convert-NativeUtf8 $bindingBytes) | ConvertFrom-Json
            $snapshotHash = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $directory 'phase-receipt.json'))
            $currentHash = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir 'inventory-check.json'))
            if ($snapshotHash -cne $binding.phaseReceiptSha256 -or $currentHash -cne $snapshotHash -or $currentHash -cne $expectedCurrentHash) { throw 'Inventory phase receipt bytes changed/unbound' }
          }
          function Observe-NativeInventoryPhaseRetention([string]$evidenceDir,$collection) {
            # Inspect all available inputs even if no preExecutionInventory return was recorded.
            $directory = Join-Path $evidenceDir 'ctest-inventory'
            $sources = @(
              @{name='inventory-check.current.json';source=(Join-Path $evidenceDir 'inventory-check.json')},
              @{name='test-inventory.current.json';source=(Join-Path $evidenceDir 'test-inventory.json')},
              @{name='phase-receipt.json';source=(Join-Path $directory 'phase-receipt.json')},
              @{name='phase-binding.json';source=(Join-Path $directory 'phase-binding.json')},
              @{name='phase-binding.sha256';source=(Join-Path $directory 'phase-binding.sha256')},
              @{name='LastTest.snapshot.log';source=(Join-Path $directory 'LastTest.snapshot.log')},
              @{name='LastTest.moved.log';source=(Join-Path $directory 'LastTest.moved.log')},
              @{name='test-inventory.json';source=(Join-Path $directory 'test-inventory.json')})
            $available = @($sources | Where-Object { Test-Path -LiteralPath $_.source -PathType Leaf })
            $observation = @{phaseStatus='NOT_RUN';qualified=$false;captures=@();checks=@()}
            $collection.inventoryPhaseObservation = $observation
            if ($available.Count -eq 0) { return }
            $snapshots = @{}
            $finalDirectory = Join-Path $evidenceDir 'ctest-final/inventory-archive'
            $copyDirectoryCreated = $false
            try { New-Item -ItemType Directory -Path $finalDirectory | Out-Null; $copyDirectoryCreated = $true }
            catch { $collection.errors += 'Inventory phase final-copy directory unavailable: '+$_.Exception.Message }
            foreach ($source in $sources) {
              if (-not (Test-Path -LiteralPath $source.source -PathType Leaf)) {
                $observation.captures += @{name=$source.name;status='NOT_AVAILABLE'}
                continue
              }
              try {
                $bytes = Read-NativeLockedBytes $source.source
                $snapshot = @{name=$source.name;bytes=$bytes;sha256=(Get-NativeByteHash $bytes);size=$bytes.Length}
                $snapshots[$source.name] = $snapshot
                $copyStatus = 'COPY_UNAVAILABLE'
                if ($copyDirectoryCreated) {
                  try { $null = Write-NativeNewBytes (Join-Path $finalDirectory $source.name) $bytes; $copyStatus = 'CAPTURED' }
                  catch { $collection.errors += 'Inventory phase final-copy failed for '+$source.name+': '+$_.Exception.Message }
                }
                $observation.captures += @{name=$source.name;status=$copyStatus;sha256=$snapshot.sha256;size=$snapshot.size;path=if($copyStatus -ceq 'CAPTURED'){'ctest-final/inventory-archive/'+$source.name}else{$null}}
              } catch { $collection.errors += 'Inventory phase capture failed for '+$source.name+': '+$_.Exception.Message }
            }
            $binding = $null
            $bindingTrusted = $false
            if ($snapshots.ContainsKey('phase-binding.json')) {
              try { $binding = (Convert-NativeUtf8 $snapshots['phase-binding.json'].bytes) | ConvertFrom-Json }
              catch { $collection.errors += 'Inventory phase-binding JSON invalid: '+$_.Exception.Message }
            }
            if ($binding -and $snapshots.ContainsKey('phase-binding.sha256')) {
              $digest = Convert-NativeUtf8 $snapshots['phase-binding.sha256'].bytes
              $bindingTrusted = $digest -match '\A[0-9A-F]{64}\n\z' -and $snapshots['phase-binding.json'].sha256 -ceq $digest.TrimEnd("`n")
            }
            if (-not $bindingTrusted) { $collection.errors += 'Inventory phase binding missing, invalid or changed' }
            $observation.bindingTrusted = $bindingTrusted
            $expected = @{}
            if ($binding) {
              $expected['phase-receipt.json'] = $binding.phaseReceiptSha256
              $expected['inventory-check.current.json'] = $binding.phaseReceiptSha256
              foreach ($name in @('LastTest.snapshot.log','LastTest.moved.log','test-inventory.json')) { $expected[$name] = $binding.archiveHashes.$name }
              $expected['test-inventory.current.json'] = $binding.archiveHashes.'test-inventory.json'
            }
            foreach ($name in @('phase-receipt.json','inventory-check.current.json','LastTest.snapshot.log','LastTest.moved.log','test-inventory.json','test-inventory.current.json')) {
              $hash = $expected[$name]
              $present = $snapshots.ContainsKey($name)
              $known = $hash -is [string] -and $hash -match '\A[0-9A-Fa-f]{64}\z'
              $matched = $present -and $known -and $snapshots[$name].sha256 -eq $hash
              $observation.checks += @{name=$name;present=$present;expectedHashKnown=$known;expectedSha256=$hash;actualSha256=if($present){$snapshots[$name].sha256}else{$null};hashMatched=$matched;bindingTrusted=$bindingTrusted}
              if ($present -and -not $known) { $collection.errors += 'Available inventory phase/archive bytes are unbound: '+$name }
              elseif ($known -and -not $matched) { $collection.errors += 'Inventory phase/archive bytes missing or changed: '+$name }
            }
            $phase = $null
            $phaseSource = if ($snapshots.ContainsKey('phase-receipt.json')) { 'phase-receipt.json' } elseif ($snapshots.ContainsKey('inventory-check.current.json')) { 'inventory-check.current.json' } else { $null }
            if ($phaseSource) {
              try { $phase = (Convert-NativeUtf8 $snapshots[$phaseSource].bytes) | ConvertFrom-Json; $observation.phaseStatus=$phase.status }
              catch { $observation.phaseStatus='INVALID';$collection.errors += 'Inventory phase receipt JSON invalid: '+$_.Exception.Message }
            } else { $observation.phaseStatus='MISSING';$collection.errors += 'Inventory phase receipt missing beside available inputs' }
            if ($observation.phaseStatus -cne 'PASS') { $collection.errors += 'Inventory phase failed or partial: '+$observation.phaseStatus }
            if ($phase -and $phase.status -ceq 'PASS') {
              if ($phase.inventoryExit -ne 0 -or $phase.count -ne 10 -or $phase.preInventoryLogAbsent -isnot [bool] -or -not $phase.preInventoryLogAbsent -or
                  $phase.inventoryLogTransferred -isnot [bool] -or -not $phase.inventoryLogTransferred) { $collection.errors += 'Inventory phase completeness/freshness facts invalid' }
              foreach ($name in @('phase-receipt.json','inventory-check.current.json','LastTest.snapshot.log','LastTest.moved.log','test-inventory.json','test-inventory.current.json')) {
                if (-not $snapshots.ContainsKey($name) -or -not $expected[$name]) { $collection.errors += 'Successful inventory phase is incomplete/unbound: '+$name }
              }
            }
            # Captures/checks do not promote any failed/partial phase or establish native execution.
          }
          $inventoryDirCreated = $false
          $receipt = [ordered]@{ status = 'RUNNING'; inventoryExit = $null; count = $null; preInventoryLogAbsent = $false; inventoryLogTransferred = $false }
          try {
            $inventoryDir = Join-Path $evidenceDir 'ctest-inventory'
            New-Item -ItemType Directory -Path $inventoryDir | Out-Null
            $inventoryDirCreated = $true
            if (Test-Path -LiteralPath (Join-Path $buildDir 'Testing/Temporary/LastTest.log')) { throw 'Pre-inventory log already exists; provenance unqualified' }
            $receipt.preInventoryLogAbsent = $true
            & ctest --test-dir $buildDir -C Release --show-only=json-v1 > (Join-Path $evidenceDir 'test-inventory.json')
            $receipt.inventoryExit = $LASTEXITCODE
            if ($receipt.inventoryExit -ne 0) { throw 'CTest inventory failed' }
            $inventoryJson = Save-NativeEvidenceSnapshot (Join-Path $evidenceDir 'test-inventory.json') (Join-Path $inventoryDir 'test-inventory.json') 'test-inventory.json'
            $receipt.inventoryJsonSnapshotSha256 = $inventoryJson.sha256
            $inventory = (Convert-NativeUtf8 $inventoryJson.bytes) | ConvertFrom-Json
            $receipt.count = @($inventory.tests).Count
            if ($receipt.count -ne 10 -or @($inventory.tests.name | Sort-Object -Unique).Count -ne 10) { throw 'CTest cohort missing or duplicated' }
            $exe = (Resolve-Path -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe')).Path
            $manifestPath = Join-Path $evidenceDir 'embedded-manifest-verification.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
            if ($manifest.status -ne 'PASS' -or $manifest.checkoutSha -ne $inputs.checkoutSha -or $manifest.workflowSha256 -ne $inputs.workflowSha256 -or
                $manifest.binarySha256Before -ne (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -or $manifest.binarySha256After -ne $manifest.binarySha256Before -or
                $manifest.xmlSha256 -ne (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash) { throw 'Manifest qualification is not bound to the exact inventory executable' }
            if ($manifest.assemblyIdentityValidation -cne 'PASS') { throw 'Inventory identity not qualified' }
            foreach ($profile in @($manifest.expectedAssemblyIdentity, $manifest.generatedAssemblyIdentity, $manifest.extractedAssemblyIdentity)) {
              if ($null -eq $profile) { throw 'Inventory identity map missing' }
              $keys = if ($profile -is [Collections.IDictionary]) { @($profile.Keys) } else { @($profile.PSObject.Properties.Name) }
              if ((($keys | Sort-Object) -join ',') -cne 'name,processorArchitecture,type,version') { throw 'Inventory identity keys differ' }
              foreach ($key in @('type','name','version','processorArchitecture')) { if (-not [string]::Equals([string]$profile.$key, [string]$inputs.expectedAssemblyIdentity.$key, [StringComparison]::Ordinal)) { throw 'Inventory identity profile drift' } }
            }
            $receipt.embeddedManifestVerificationSha256 = $manifestHash
            foreach ($expected in $inputs.expectedTests) {
              $matchingTests = @($inventory.tests | Where-Object { $_.name -eq $expected.name })
              if ($matchingTests.Count -ne 1) { throw "Missing exact test: $($expected.name)" }
              $test = $matchingTests[0]
              if (@($test.command).Count -ne 2 -or $test.command[1] -ne $expected.mode -or
                  -not [string]::Equals([IO.Path]::GetFullPath($test.command[0]), $exe, [StringComparison]::OrdinalIgnoreCase)) { throw 'CTest command differs from exact built probe/mode' }
              $timeouts = @($test.properties | Where-Object { $_.name -eq 'TIMEOUT' })
              if ($timeouts.Count -ne 1 -or [double]$timeouts[0].value -ne $expected.timeout) { throw 'CTest timeout changed' }
              if (@($test.properties | Where-Object { $_.name -eq 'SKIP_RETURN_CODE' -or
                    ($_.name -in @('DISABLED', 'WILL_FAIL') -and $_.value) }).Count) { throw 'CTest skip or nonzero override present' }
            }
            if ((Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir 'test-inventory.json'))) -cne $receipt.inventoryJsonSnapshotSha256) { throw 'Inventory JSON changed before qualification transfer' }
            Preserve-NativeInventoryLog $buildDir $evidenceDir $receipt
            $receipt.status = 'PASS'
          } catch {
            $receipt.status = 'FAIL'; $receipt.error = $_.Exception.Message; throw
          } finally {
            Write-NativeInventoryPhaseEvidence $evidenceDir $inventoryDir $inventoryDirCreated $receipt
          }

      - name: Execute ten native cases once and validate complete evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $inputs = Get-Content -LiteralPath (Join-Path $evidenceDir 'inputs.json') -Raw | ConvertFrom-Json
          $compile = Get-Content -LiteralPath (Join-Path $evidenceDir 'compile.json') -Raw | ConvertFrom-Json
          $result = [ordered]@{ status = 'RUNNING'; CI_OWN_WINDOW = 'RUNNING'; testExit = $null; results = @()
            ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'; ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED' }
          try {
            $manifestPath = Join-Path $evidenceDir 'embedded-manifest-verification.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
            if ($manifest.status -ne 'PASS' -or $manifest.checkoutSha -ne $inputs.checkoutSha -or $manifest.workflowSha256 -ne $inputs.workflowSha256 -or
                $manifest.binarySha256Before -ne $compile.binary.sha256 -or $manifest.binarySha256After -ne $compile.binary.sha256 -or
                $manifestHash -ne $compile.embeddedManifestVerification.receiptSha256 -or
                $manifest.xmlSha256 -ne (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash -or
                (Get-FileHash -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe') -Algorithm SHA256).Hash -ne $compile.binary.sha256) { throw 'Manifest verification prerequisite failed before native execution' }
            if ($manifest.assemblyIdentityValidation -cne 'PASS') { throw 'Pre-CTest identity not qualified' }
            foreach ($profile in @($manifest.expectedAssemblyIdentity, $manifest.generatedAssemblyIdentity, $manifest.extractedAssemblyIdentity)) {
              if ($null -eq $profile) { throw 'Pre-CTest identity map missing' }
              $keys = if ($profile -is [Collections.IDictionary]) { @($profile.Keys) } else { @($profile.PSObject.Properties.Name) }
              if ((($keys | Sort-Object) -join ',') -cne 'name,processorArchitecture,type,version') { throw 'Pre-CTest identity keys differ' }
              foreach ($key in @('type','name','version','processorArchitecture')) { if (-not [string]::Equals([string]$profile.$key, [string]$inputs.expectedAssemblyIdentity.$key, [StringComparison]::Ordinal)) { throw 'Pre-CTest identity profile drift' } }
            }
            $result.embeddedManifestVerificationSha256 = $manifestHash
            $result.assemblyIdentity = $manifest.extractedAssemblyIdentity
            function Read-NativeLockedBytes([string]$path) {
              $stream = [IO.FileStream]::new($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
              try {
                $buffer = [IO.MemoryStream]::new()
                try { $stream.CopyTo($buffer); return ,$buffer.ToArray() } finally { $buffer.Dispose() }
              } finally { $stream.Dispose() }
            }
            function Get-NativeByteHash([byte[]]$bytes) {
              return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
            }
            function Convert-NativeUtf8([byte[]]$bytes) {
              $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
              if ($text.Length -and $text[0] -eq [char]0xFEFF) { $text = $text.Substring(1) }
              return $text
            }
            function Write-NativeNewBytes([string]$path, [byte[]]$bytes) {
              $stream = [IO.FileStream]::new($path, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
              try { $stream.Write($bytes, 0, $bytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
              $expected = Get-NativeByteHash $bytes
              if ((Get-NativeByteHash (Read-NativeLockedBytes $path)) -cne $expected) { throw 'New evidence copy differs from consumed bytes' }
              return $expected
            }
            function Save-NativeEvidenceSnapshot([string]$source, [string]$destination, [string]$name) {
              $bytes = Read-NativeLockedBytes $source
              $hash = Write-NativeNewBytes $destination $bytes
              return @{ name=$name; source=$source; destination=$destination; sha256=$hash; size=$bytes.Length; bytes=$bytes }
            }

            function Confirm-NativeInventoryOnlyLog([byte[]]$bytes) {
              $text = Convert-NativeUtf8 $bytes
              $format = '\AStart testing: [^\r\n]+\r?\n----------------------------------------------------------\r?\nEnd testing: [^\r\n]+\r?\n\z'
              if (-not [regex]::IsMatch($text,$format)) { throw 'Inventory log contains unexpected/stale execution evidence or malformed framing' }
            }
            function Preserve-NativeInventoryLog([string]$buildDir,[string]$evidenceDir,$receipt) {
              $inventoryDir = Join-Path $evidenceDir 'ctest-inventory'
              $source = Join-Path $buildDir 'Testing/Temporary/LastTest.log'
              $snapshot = Save-NativeEvidenceSnapshot $source (Join-Path $inventoryDir 'LastTest.snapshot.log') 'LastTest.snapshot.log'
              $receipt.inventoryLogSnapshotSha256 = $snapshot.sha256
              $receipt.inventoryLogSnapshotBytes = $snapshot.size
              Confirm-NativeInventoryOnlyLog $snapshot.bytes
              if ((Get-NativeByteHash (Read-NativeLockedBytes $source)) -cne $snapshot.sha256) { throw 'Inventory-generated log changed before preserved transfer' }
              $moved = Join-Path $inventoryDir 'LastTest.moved.log'
              if (Test-Path -LiteralPath $moved) { throw 'Inventory transfer destination already exists' }
              $expectedSource = [IO.Path]::GetFullPath((Join-Path $buildDir 'Testing/Temporary/LastTest.log'))
              $expectedDestination = [IO.Path]::GetFullPath((Join-Path $evidenceDir 'ctest-inventory/LastTest.moved.log'))
              if (-not [string]::Equals([IO.Path]::GetFullPath($source),$expectedSource,[StringComparison]::OrdinalIgnoreCase) -or
                  -not [string]::Equals([IO.Path]::GetFullPath($moved),$expectedDestination,[StringComparison]::OrdinalIgnoreCase)) { throw 'Inventory transfer path escaped exact admitted boundary' }
              Move-Item -LiteralPath $source -Destination $moved
              $movedHash = Get-NativeByteHash (Read-NativeLockedBytes $moved)
              $receipt.inventoryLogMovedSha256 = $movedHash
              if ($movedHash -cne $snapshot.sha256 -or (Test-Path -LiteralPath $source)) { throw 'Inventory source transfer drift or original path remains' }
              $receipt.inventoryLogTransferred = $true
            }
            function Confirm-NativeArchivedInventory([string]$evidenceDir,$receipt) {
              if ($receipt.status -cne 'PASS' -or $receipt.inventoryExit -ne 0 -or $receipt.count -ne 10 -or
                  $receipt.preInventoryLogAbsent -isnot [bool] -or -not $receipt.preInventoryLogAbsent -or
                  $receipt.inventoryLogTransferred -isnot [bool] -or -not $receipt.inventoryLogTransferred) { throw 'Qualified inventory freshness boundary missing' }
              foreach ($entry in @(
                  @{path='ctest-inventory/LastTest.snapshot.log';hash=$receipt.inventoryLogSnapshotSha256;inventoryLog=$true},
                  @{path='ctest-inventory/LastTest.moved.log';hash=$receipt.inventoryLogMovedSha256;inventoryLog=$true},
                  @{path='ctest-inventory/test-inventory.json';hash=$receipt.inventoryJsonSnapshotSha256;inventoryLog=$false},
                  @{path='test-inventory.json';hash=$receipt.inventoryJsonSnapshotSha256;inventoryLog=$false})) {
                $bytes = Read-NativeLockedBytes (Join-Path $evidenceDir $entry.path)
                if (-not $entry.hash -or (Get-NativeByteHash $bytes) -cne $entry.hash) { throw 'Qualified inventory preserved/current bytes drifted' }
                if ($entry.inventoryLog) { Confirm-NativeInventoryOnlyLog $bytes }
              }
              if ($receipt.inventoryLogSnapshotSha256 -cne $receipt.inventoryLogMovedSha256) { throw 'Inventory preserved transfer hashes differ' }
            }
            function Confirm-NativePreExecutionInventory([string]$buildDir,[string]$evidenceDir,[string]$manifestHash) {
              $receiptBytes = Read-NativeLockedBytes (Join-Path $evidenceDir 'inventory-check.json')
              $receipt = (Convert-NativeUtf8 $receiptBytes) | ConvertFrom-Json
              Confirm-NativeInventoryPhaseBinding $evidenceDir (Get-NativeByteHash $receiptBytes)
              if ($receipt.embeddedManifestVerificationSha256 -cne $manifestHash) { throw 'Inventory freshness manifest binding differs' }
              Confirm-NativeArchivedInventory $evidenceDir $receipt
              if (Test-Path -LiteralPath (Join-Path $buildDir 'Testing/Temporary/LastTest.log')) { throw 'Unexpected native execution log after qualified inventory transfer' }
              return @{ receipt=$receipt; receiptSha256=(Get-NativeByteHash $receiptBytes) }
            }
            function Write-NativeInventoryPhaseEvidence([string]$evidenceDir,[string]$inventoryDir,[bool]$created,$receipt) {
              $phaseBytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json -Depth 8))
              $phaseHash = Write-NativeNewBytes (Join-Path $evidenceDir 'inventory-check.json') $phaseBytes
              if (-not $created) { return }
              $null = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-receipt.json') $phaseBytes
              $binding = @{ phaseReceiptSha256=$phaseHash; phaseStatus=$receipt.status; archiveHashes=@{
                'LastTest.snapshot.log'=$receipt.inventoryLogSnapshotSha256
                'LastTest.moved.log'=$receipt.inventoryLogMovedSha256
                'test-inventory.json'=$receipt.inventoryJsonSnapshotSha256 } }
              $bindingBytes = [Text.UTF8Encoding]::new($false).GetBytes(($binding | ConvertTo-Json -Depth 8))
              $bindingHash = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-binding.json') $bindingBytes
              $null = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-binding.sha256') ([Text.Encoding]::ASCII.GetBytes($bindingHash+"`n"))
            }
            function Confirm-NativeInventoryPhaseBinding([string]$evidenceDir,[string]$expectedCurrentHash) {
              $directory = Join-Path $evidenceDir 'ctest-inventory'
              $bindingBytes = Read-NativeLockedBytes (Join-Path $directory 'phase-binding.json')
              $digest = Convert-NativeUtf8 (Read-NativeLockedBytes (Join-Path $directory 'phase-binding.sha256'))
              if ($digest -notmatch '\A[0-9A-F]{64}\n\z' -or (Get-NativeByteHash $bindingBytes) -cne $digest.TrimEnd("`n")) { throw 'Inventory phase-binding bytes changed/unbound' }
              $binding = (Convert-NativeUtf8 $bindingBytes) | ConvertFrom-Json
              $snapshotHash = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $directory 'phase-receipt.json'))
              $currentHash = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir 'inventory-check.json'))
              if ($snapshotHash -cne $binding.phaseReceiptSha256 -or $currentHash -cne $snapshotHash -or $currentHash -cne $expectedCurrentHash) { throw 'Inventory phase receipt bytes changed/unbound' }
            }
            function Observe-NativeInventoryPhaseRetention([string]$evidenceDir,$collection) {
              # Inspect all available inputs even if no preExecutionInventory return was recorded.
              $directory = Join-Path $evidenceDir 'ctest-inventory'
              $sources = @(
                @{name='inventory-check.current.json';source=(Join-Path $evidenceDir 'inventory-check.json')},
                @{name='test-inventory.current.json';source=(Join-Path $evidenceDir 'test-inventory.json')},
                @{name='phase-receipt.json';source=(Join-Path $directory 'phase-receipt.json')},
                @{name='phase-binding.json';source=(Join-Path $directory 'phase-binding.json')},
                @{name='phase-binding.sha256';source=(Join-Path $directory 'phase-binding.sha256')},
                @{name='LastTest.snapshot.log';source=(Join-Path $directory 'LastTest.snapshot.log')},
                @{name='LastTest.moved.log';source=(Join-Path $directory 'LastTest.moved.log')},
                @{name='test-inventory.json';source=(Join-Path $directory 'test-inventory.json')})
              $available = @($sources | Where-Object { Test-Path -LiteralPath $_.source -PathType Leaf })
              $observation = @{phaseStatus='NOT_RUN';qualified=$false;captures=@();checks=@()}
              $collection.inventoryPhaseObservation = $observation
              if ($available.Count -eq 0) { return }
              $snapshots = @{}
              $finalDirectory = Join-Path $evidenceDir 'ctest-final/inventory-archive'
              $copyDirectoryCreated = $false
              try { New-Item -ItemType Directory -Path $finalDirectory | Out-Null; $copyDirectoryCreated = $true }
              catch { $collection.errors += 'Inventory phase final-copy directory unavailable: '+$_.Exception.Message }
              foreach ($source in $sources) {
                if (-not (Test-Path -LiteralPath $source.source -PathType Leaf)) {
                  $observation.captures += @{name=$source.name;status='NOT_AVAILABLE'}
                  continue
                }
                try {
                  $bytes = Read-NativeLockedBytes $source.source
                  $snapshot = @{name=$source.name;bytes=$bytes;sha256=(Get-NativeByteHash $bytes);size=$bytes.Length}
                  $snapshots[$source.name] = $snapshot
                  $copyStatus = 'COPY_UNAVAILABLE'
                  if ($copyDirectoryCreated) {
                    try { $null = Write-NativeNewBytes (Join-Path $finalDirectory $source.name) $bytes; $copyStatus = 'CAPTURED' }
                    catch { $collection.errors += 'Inventory phase final-copy failed for '+$source.name+': '+$_.Exception.Message }
                  }
                  $observation.captures += @{name=$source.name;status=$copyStatus;sha256=$snapshot.sha256;size=$snapshot.size;path=if($copyStatus -ceq 'CAPTURED'){'ctest-final/inventory-archive/'+$source.name}else{$null}}
                } catch { $collection.errors += 'Inventory phase capture failed for '+$source.name+': '+$_.Exception.Message }
              }
              $binding = $null
              $bindingTrusted = $false
              if ($snapshots.ContainsKey('phase-binding.json')) {
                try { $binding = (Convert-NativeUtf8 $snapshots['phase-binding.json'].bytes) | ConvertFrom-Json }
                catch { $collection.errors += 'Inventory phase-binding JSON invalid: '+$_.Exception.Message }
              }
              if ($binding -and $snapshots.ContainsKey('phase-binding.sha256')) {
                $digest = Convert-NativeUtf8 $snapshots['phase-binding.sha256'].bytes
                $bindingTrusted = $digest -match '\A[0-9A-F]{64}\n\z' -and $snapshots['phase-binding.json'].sha256 -ceq $digest.TrimEnd("`n")
              }
              if (-not $bindingTrusted) { $collection.errors += 'Inventory phase binding missing, invalid or changed' }
              $observation.bindingTrusted = $bindingTrusted
              $expected = @{}
              if ($binding) {
                $expected['phase-receipt.json'] = $binding.phaseReceiptSha256
                $expected['inventory-check.current.json'] = $binding.phaseReceiptSha256
                foreach ($name in @('LastTest.snapshot.log','LastTest.moved.log','test-inventory.json')) { $expected[$name] = $binding.archiveHashes.$name }
                $expected['test-inventory.current.json'] = $binding.archiveHashes.'test-inventory.json'
              }
              foreach ($name in @('phase-receipt.json','inventory-check.current.json','LastTest.snapshot.log','LastTest.moved.log','test-inventory.json','test-inventory.current.json')) {
                $hash = $expected[$name]
                $present = $snapshots.ContainsKey($name)
                $known = $hash -is [string] -and $hash -match '\A[0-9A-Fa-f]{64}\z'
                $matched = $present -and $known -and $snapshots[$name].sha256 -eq $hash
                $observation.checks += @{name=$name;present=$present;expectedHashKnown=$known;expectedSha256=$hash;actualSha256=if($present){$snapshots[$name].sha256}else{$null};hashMatched=$matched;bindingTrusted=$bindingTrusted}
                if ($present -and -not $known) { $collection.errors += 'Available inventory phase/archive bytes are unbound: '+$name }
                elseif ($known -and -not $matched) { $collection.errors += 'Inventory phase/archive bytes missing or changed: '+$name }
              }
              $phase = $null
              $phaseSource = if ($snapshots.ContainsKey('phase-receipt.json')) { 'phase-receipt.json' } elseif ($snapshots.ContainsKey('inventory-check.current.json')) { 'inventory-check.current.json' } else { $null }
              if ($phaseSource) {
                try { $phase = (Convert-NativeUtf8 $snapshots[$phaseSource].bytes) | ConvertFrom-Json; $observation.phaseStatus=$phase.status }
                catch { $observation.phaseStatus='INVALID';$collection.errors += 'Inventory phase receipt JSON invalid: '+$_.Exception.Message }
              } else { $observation.phaseStatus='MISSING';$collection.errors += 'Inventory phase receipt missing beside available inputs' }
              if ($observation.phaseStatus -cne 'PASS') { $collection.errors += 'Inventory phase failed or partial: '+$observation.phaseStatus }
              if ($phase -and $phase.status -ceq 'PASS') {
                if ($phase.inventoryExit -ne 0 -or $phase.count -ne 10 -or $phase.preInventoryLogAbsent -isnot [bool] -or -not $phase.preInventoryLogAbsent -or
                    $phase.inventoryLogTransferred -isnot [bool] -or -not $phase.inventoryLogTransferred) { $collection.errors += 'Inventory phase completeness/freshness facts invalid' }
                foreach ($name in @('phase-receipt.json','inventory-check.current.json','LastTest.snapshot.log','LastTest.moved.log','test-inventory.json','test-inventory.current.json')) {
                  if (-not $snapshots.ContainsKey($name) -or -not $expected[$name]) { $collection.errors += 'Successful inventory phase is incomplete/unbound: '+$name }
                }
              }
              # Captures/checks do not promote any failed/partial phase or establish native execution.
            }
            $inventoryGate = Confirm-NativePreExecutionInventory $buildDir $evidenceDir $manifestHash
            $result.preExecutionInventory = $inventoryGate
            & ctest --test-dir $buildDir -C Release --parallel 1 --stop-on-failure --no-tests=error --verbose `
              --output-log (Join-Path $evidenceDir 'ctest.log') --output-junit (Join-Path $evidenceDir 'ctest-junit.xml')
            $result.testExit = $LASTEXITCODE
            if ($result.testExit -ne 0) { throw "Real Native UIA CTest failure: $($result.testExit)" }
            function Read-NativeLockedBytes([string]$path) {
              $stream = [IO.FileStream]::new($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
              try {
                $buffer = [IO.MemoryStream]::new()
                try { $stream.CopyTo($buffer); return ,$buffer.ToArray() } finally { $buffer.Dispose() }
              } finally { $stream.Dispose() }
            }
            function Get-NativeByteHash([byte[]]$bytes) {
              return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
            }
            function Convert-NativeUtf8([byte[]]$bytes) {
              $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
              if ($text.Length -and $text[0] -eq [char]0xFEFF) { $text = $text.Substring(1) }
              return $text
            }
            function Write-NativeNewBytes([string]$path, [byte[]]$bytes) {
              $stream = [IO.FileStream]::new($path, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
              try { $stream.Write($bytes, 0, $bytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
              $expected = Get-NativeByteHash $bytes
              if ((Get-NativeByteHash (Read-NativeLockedBytes $path)) -cne $expected) { throw 'New evidence copy differs from consumed bytes' }
              return $expected
            }
            function Save-NativeEvidenceSnapshot([string]$source, [string]$destination, [string]$name) {
              $bytes = Read-NativeLockedBytes $source
              $hash = Write-NativeNewBytes $destination $bytes
              return @{ name=$name; source=$source; destination=$destination; sha256=$hash; size=$bytes.Length; bytes=$bytes }
            }
            function Get-NativeSnapshotMetadata($snapshot) {
              return @{ name=$snapshot.name; path='ctest-consumed/' + $snapshot.name; sha256=$snapshot.sha256; size=$snapshot.size }
            }
            function Assert-NativeSnapshotsStable($snapshots) {
              foreach ($snapshot in $snapshots) {
                if ((Get-NativeByteHash (Read-NativeLockedBytes $snapshot.destination)) -cne $snapshot.sha256) {
                  throw ('Consumed snapshot changed: ' + $snapshot.name)
                }
                if ((Get-NativeByteHash (Read-NativeLockedBytes $snapshot.source)) -cne $snapshot.sha256) {
                  throw ('Consumed source changed: ' + $snapshot.name)
                }
              }
            }
            function Confirm-NativeInventoryProfile($inventory, $expectedTests, [string]$expectedExe, [string]$expectedDirectory) {
              if (@($inventory.tests).Count -ne 10 -or @($expectedTests).Count -ne 10) { throw 'Consumed inventory cohort differs' }
              $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              $expectedSeen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              foreach ($expected in $expectedTests) {
                if (-not $expectedSeen.Add([string]$expected.name)) { throw 'Expected test identity duplicated' }
              }
              foreach ($registration in $inventory.tests) {
                if (-not $seen.Add([string]$registration.name)) { throw 'Consumed inventory test duplicated' }
                $expected = @($expectedTests | Where-Object { [string]::Equals($_.name, $registration.name, [StringComparison]::Ordinal) })
                if ($expected.Count -ne 1 -or @($registration.command).Count -ne 2 -or
                    $registration.command[1] -cne $expected[0].mode -or
                    -not [string]::Equals(([string]$registration.command[0]).Replace('\','/'), $expectedExe.Replace('\','/'), [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'Consumed inventory name, executable or mode differs'
                }
                $properties = @($registration.properties)
                $timeouts = @($properties | Where-Object { $_.name -eq 'TIMEOUT' })
                $directories = @($properties | Where-Object { $_.name -eq 'WORKING_DIRECTORY' })
                if ($timeouts.Count -ne 1 -or [double]$timeouts[0].value -ne $expected[0].timeout -or
                    $directories.Count -ne 1 -or
                    -not [string]::Equals(([string]$directories[0].value).Replace('\','/'), $expectedDirectory.Replace('\','/'), [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'Consumed inventory TIMEOUT or working directory differs'
                }
                if (@($properties | Where-Object { $_.name -eq 'SKIP_RETURN_CODE' -or
                      ($_.name -in @('DISABLED','WILL_FAIL') -and $_.value) }).Count) {
                  throw 'Consumed inventory skip, disabled or WILL_FAIL override present'
                }
              }
              if ($seen.Count -ne $expectedSeen.Count) { throw 'Consumed inventory identities incomplete' }
            }

            function Read-NativeCTestFullOutputs([string]$lastText, $inventory, $expectedTests, $cases) {
              $separator = '----------------------------------------------------------'
              $frame = '(?m)^(?<index>\d+)/(?<total>\d+) Testing: (?<name>native_uia_[a-z_]+)\r?\n' +
                '\k<index>/\k<total> Test: \k<name>\r?\n' +
                'Command: (?<command>[^\r\n]+)\r?\nDirectory: (?<directory>[^\r\n]+)\r?\n' +
                '"\k<name>" start time: [^\r\n]+\r?\nOutput:\r?\n' + $separator + '\r?\n' +
                '(?<output>[\s\S]*?)^<end of output>\r?\n' +
                'Test time = +(?<seconds>\d+(?:\.\d+)?) sec\r?\n' + $separator + '\r?\n' +
                'Test Passed\.\r?\n"\k<name>" end time: [^\r\n]+\r?\n' +
                '"\k<name>" time elapsed: \d+:\d+:\d+\r?\n' + $separator + '\r?\n'
              $blocks = [regex]::Matches($lastText, $frame, [Text.RegularExpressions.RegexOptions]::None,
                [TimeSpan]::FromSeconds(2))
              if ($blocks.Count -ne 10 -or @($inventory.tests).Count -ne 10 -or
                  @($expectedTests).Count -ne 10 -or @($cases).Count -ne 10) { throw 'Complete CTest cohort unavailable' }
              # Reject duplicate, partial, nested, substituted or truncated frames. No JUnit/log fallback.
              foreach ($marker in @('^\d+/\d+ Testing: ', '^\d+/\d+ Test: ', '^Command: ', '^Directory: ',
                  '^Output:\r?$', '^<end of output>\r?$', '^Test Passed\.\r?$')) {
                if ([regex]::Matches($lastText, $marker, [Text.RegularExpressions.RegexOptions]::Multiline).Count -ne 10) {
                  throw 'Ambiguous or incomplete CTest log framing'
                }
              }
              if ($lastText -match '(?m)^Test Failed\.|\[This part of the test output was removed since it') {
                throw 'Failed or truncated full CTest log'
              }
              if ([regex]::Matches($lastText, '(?m)^Start testing: [^\r\n]+\r?$').Count -ne 1 -or
                  [regex]::Matches($lastText, '(?m)^End testing: [^\r\n]+\r?$').Count -ne 1) {
                throw 'CTest session boundaries missing or ambiguous'
              }
              $sessionStart = [regex]::Match($lastText, '(?m)^Start testing: [^\r\n]+\r?$')
              $sessionEnd = [regex]::Match($lastText, '(?m)^End testing: [^\r\n]+\r?$')
              if ($blocks[0].Index -le $sessionStart.Index -or
                  $blocks[$blocks.Count - 1].Index + $blocks[$blocks.Count - 1].Length -gt $sessionEnd.Index) {
                throw 'CTest blocks escape their completed session'
              }
              $outputs = [Collections.Generic.Dictionary[string,string]]::new([StringComparer]::Ordinal)
              $identities = [Collections.Generic.HashSet[int]]::new()
              $records = @()
              foreach ($block in $blocks) {
                $index = [int]$block.Groups['index'].Value
                $name = $block.Groups['name'].Value
                if ([int]$block.Groups['total'].Value -ne 10 -or $index -lt 1 -or $index -gt 10 -or
                    -not $identities.Add($index) -or $outputs.ContainsKey($name)) { throw 'CTest identity duplicated or invalid' }
                $registration = $inventory.tests[$index - 1]
                $expected = @($expectedTests | Where-Object { [string]::Equals($_.name, $name, [StringComparison]::Ordinal) })
                $case = @($cases | Where-Object { [string]::Equals($_.GetAttribute('name'), $name, [StringComparison]::Ordinal) })
                if ($expected.Count -ne 1 -or $case.Count -ne 1 -or
                    -not [string]::Equals($registration.name, $name, [StringComparison]::Ordinal) -or
                    $case[0].GetAttribute('status') -cne 'run' -or
                    $case[0].GetAttribute('classname') -cne $name -or
                    @($registration.command).Count -ne 2 -or $registration.command[1] -cne $expected[0].mode) {
                  throw 'CTest log/JUnit/inventory exact identity differs'
                }
                foreach ($argument in $registration.command) {
                  if ([string]$argument -match '["\r\n]') { throw 'Unsupported CTest command encoding' }
                }
                $expectedCommand = ($registration.command | ForEach-Object { '"' + $_ + '"' }) -join ' '
                $directories = @($registration.properties | Where-Object { $_.name -ceq 'WORKING_DIRECTORY' })
                if ($directories.Count -ne 1 -or
                    -not [string]::Equals($block.Groups['command'].Value, $expectedCommand, [StringComparison]::Ordinal) -or
                    -not [string]::Equals($block.Groups['directory'].Value, $directories[0].value, [StringComparison]::Ordinal)) {
                  throw 'CTest log command or working directory substituted'
                }
                $fullOutput = $block.Groups['output'].Value
                if (-not $fullOutput.Trim()) { throw 'Complete native case output missing' }
                $outputs.Add($name, $fullOutput)
                $records += @{ name = $name; testIndex = $index; command = @($registration.command)
                  directory = $directories[0].value; outputOffset = $block.Groups['output'].Index
                  outputCharacters = $block.Groups['output'].Length
                  outputUtf8Bytes = [Text.Encoding]::UTF8.GetByteCount($fullOutput) }
              }
              return @{ outputs = $outputs; records = $records; source = 'ctest-consumed/LastTest.log' }
            }

            # Complete raw inputs are exclusively created in a consumed namespace. All parsing uses their held bytes.
            $consumedDir = Join-Path $evidenceDir 'ctest-consumed'
            New-Item -ItemType Directory -Path $consumedDir | Out-Null
            $consumedSnapshots = @()
            $result.evidenceExtraction = @{ status='RUNNING'; source='ctest-consumed/LastTest.log'; snapshots=@(); records=@() }
            $sources = @(
              @{ name='inventory-check.json'; path=(Join-Path $evidenceDir 'inventory-check.json') },
              @{ name='test-inventory.json'; path=(Join-Path $evidenceDir 'test-inventory.json') },
              @{ name='ctest-junit.xml'; path=(Join-Path $evidenceDir 'ctest-junit.xml') },
              @{ name='LastTest.log'; path=(Join-Path $buildDir 'Testing/Temporary/LastTest.log') }
            )
            foreach ($source in $sources) {
              $snapshot = Save-NativeEvidenceSnapshot $source.path (Join-Path $consumedDir $source.name) $source.name
              $consumedSnapshots += $snapshot
              $result.evidenceExtraction.snapshots += Get-NativeSnapshotMetadata $snapshot
            }
            $captureManifest = @{ checkoutSha=$inputs.checkoutSha; workflowSha256=$inputs.workflowSha256
              runId=$inputs.runId; attempt=$inputs.attempt; binarySha256=$compile.binary.sha256
              snapshots=$result.evidenceExtraction.snapshots }
            $captureManifestBytes = [Text.UTF8Encoding]::new($false).GetBytes(($captureManifest | ConvertTo-Json -Depth 8))
            $result.evidenceExtraction.captureManifestSha256 = Write-NativeNewBytes (Join-Path $consumedDir 'manifest.json') $captureManifestBytes
            $inventoryReceipt = (Convert-NativeUtf8 $consumedSnapshots[0].bytes) | ConvertFrom-Json
            if ($inventoryReceipt.status -cne 'PASS' -or $inventoryReceipt.inventoryExit -ne 0 -or
                $inventoryReceipt.count -ne 10 -or $inventoryReceipt.embeddedManifestVerificationSha256 -cne $manifestHash -or
                $consumedSnapshots[0].sha256 -cne $inventoryGate.receiptSha256 -or
                $inventoryReceipt.inventoryJsonSnapshotSha256 -cne $consumedSnapshots[1].sha256) {
              throw 'Consumed inventory qualification receipt differs'
            }
            $inventory = (Convert-NativeUtf8 $consumedSnapshots[1].bytes) | ConvertFrom-Json
            Confirm-NativeInventoryProfile $inventory $inputs.expectedTests (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe') $buildDir
            [xml]$junit = Convert-NativeUtf8 $consumedSnapshots[2].bytes
            $cases = @($junit.SelectNodes('//*[local-name()="testcase"]'))
            if ($cases.Count -ne 10 -or @($cases | ForEach-Object { $_.GetAttribute('name') } | Sort-Object -Unique).Count -ne 10 -or
                $junit.SelectNodes('//*[local-name()="skipped" or local-name()="failure" or local-name()="error"]').Count) {
              throw 'Consumed JUnit does not prove ten executed successful cases'
            }
            $lastText = Convert-NativeUtf8 $consumedSnapshots[3].bytes
            $extraction = Read-NativeCTestFullOutputs $lastText $inventory $inputs.expectedTests $cases
            $outputs = $extraction.outputs
            $caseOutputDir = Join-Path $evidenceDir 'native-case-output'
            New-Item -ItemType Directory -Path $caseOutputDir | Out-Null
            foreach ($record in $extraction.records) {
              $record.path = 'native-case-output/' + $record.name + '.log'
              $outputBytes = [Text.UTF8Encoding]::new($false).GetBytes($outputs[$record.name])
              $record.sha256 = Write-NativeNewBytes (Join-Path $caseOutputDir ($record.name + '.log')) $outputBytes
              $case = @($cases | Where-Object { [string]::Equals($_.GetAttribute('name'), $record.name, [StringComparison]::Ordinal) })
              if ($case.Count -ne 1 -or -not $case[0].HasAttribute('time')) { throw 'Missing named result/duration' }
              $seconds = [double]::Parse($case[0].GetAttribute('time'), [Globalization.CultureInfo]::InvariantCulture)
              if ([double]::IsNaN($seconds) -or [double]::IsInfinity($seconds) -or $seconds -lt 0) { throw 'Invalid consumed JUnit duration' }
              $result.results += @{ name=$record.name; status='PASS'; seconds=$seconds }
            }
            $result.evidenceExtraction.records = $extraction.records
            $result.evidenceExtraction.inventorySha256 = $consumedSnapshots[1].sha256
            $result.evidenceExtraction.junitSha256 = $consumedSnapshots[2].sha256
            $result.evidenceExtraction.sourceSha256 = $consumedSnapshots[3].sha256
            $result.evidenceExtraction.CTest = $compile.ctestVersion
            $result.evidenceExtraction.JUnitUse = 'consumed execution status and duration only'
            Assert-NativeSnapshotsStable $consumedSnapshots
            if ((Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $consumedDir 'manifest.json'))) -cne
                $result.evidenceExtraction.captureManifestSha256) { throw 'Consumed capture manifest changed' }
            $result.evidenceExtraction.status = 'PASS'

            # Adjudicate only the native focus evidence actually printed by the frozen source.
            function Read-NativeFocusEpoch([string]$text) {
              $lines = $text -split '\r?\n'
              $headers = @($lines | Where-Object { $_ -match '^DIAGNOSTIC epoch=' })
              if ($headers.Count -ne 1) { throw 'Missing or ambiguous final diagnostic epoch' }
              $fields = @{}
              foreach ($match in [regex]::Matches($headers[0], '(\w+)=(\d+)')) { $fields[$match.Groups[1].Value] = [long]$match.Groups[2].Value }
              foreach ($key in @('epoch', 'generation', 'target', 'complete', 'valid', 'armed', 'disarm_confirmed', 'removal', 'pop_seq', 'post_pump', 'target_mutated')) {
                if (-not $fields.ContainsKey($key)) { throw 'Incomplete final diagnostic fields' }
              }
              if ($fields.epoch -le 0 -or $fields.generation -le 0 -or $fields.target -le 0 -or $fields.complete -ne 1 -or
                  $fields.valid -ne 1 -or $fields.armed -ne 0 -or $fields.disarm_confirmed -ne 1 -or
                  $fields.removal -ne 1 -or $fields.target_mutated -ne 0) { throw 'Final identity/completeness/disarm/cancellation evidence invalid' }
              $csvHeaders = @($lines | Where-Object { $_ -match '^seq,pump,token,actor,candidateOS,' })
              if ($csvHeaders.Count -ne 1) { throw 'Full focus CSV header missing' }
              $csvLines = @($lines | Where-Object { $_ -match '^\d+,\d+,\d+,' })
              $rows = @(($csvHeaders[0] + "`n" + ($csvLines -join "`n")) | ConvertFrom-Csv)
              if ($rows.Count -eq 0 -or $rows.Count -gt 256) { throw 'Focus trace absent or oversized' }
              $sequence = 0L
              foreach ($row in $rows) { ++$sequence; if ([long]$row.seq -ne $sequence) { throw 'Lost or noncontiguous focus records' } }
              $targetRows = @($rows | Where-Object { [long]$_.token -eq $fields.target })
              $cancel = @($targetRows | Where-Object { [int]$_.phase -eq 5 -and [int]$_.completion -eq 2 -and [long]$_.hr -eq -2146233083 })
              $pop = @($targetRows | Where-Object { [int]$_.phase -eq 7 -and [long]$_.seq -eq $fields.pop_seq })
              if ($cancel.Count -ne 1 -or $pop.Count -ne 1 -or [long]$cancel[0].seq -ge [long]$pop[0].seq -or
                  @($targetRows | Where-Object { [int]$_.phase -eq 6 }).Count -or
                  @($targetRows | Where-Object { [int]$_.phase -eq 2 -and [long]$_.actor -eq 1 }).Count -ne 1) { throw 'Exact target admission/cancellation/pop/nonmutation missing' }
              $cover = @($rows | Where-Object { [int]$_.phase -eq 11 -and [long]$_.seq -eq $fields.post_pump -and
                [long]$_.pump -eq [long]$pop[0].pump -and [long]$_.seq -gt [long]$pop[0].seq -and
                [long]$_.firstPop -le [long]$pop[0].seq -and [long]$_.lastPop -ge [long]$pop[0].seq })
              if ($cover.Count -ne 1 -or @($rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 13 }).Count -ne 1) { throw 'Covering final pump/epoch-end missing' }
              return @{ fields = $fields; rows = $rows; cancellationSequence = [long]$cancel[0].seq }
            }
            $focus = @{}
            foreach ($name in @('native_uia_own_window', 'native_uia_focus_isolated', 'native_uia_focus_direct_interleave', 'native_uia_focus_os_interleave')) {
              $focus[$name] = Read-NativeFocusEpoch $outputs[$name]
            }
            $isolated = $focus.native_uia_focus_isolated
            $baseline = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 5 })
            $latch = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 6 })
            $assertion = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 12 })
            $end = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 13 })
            if ($baseline.Count -ne 1 -or $latch.Count -ne 1 -or $assertion.Count -ne 1 -or $end.Count -ne 1 -or
                [int]$baseline[0].host -ne 1 -or [int]$baseline[0].after -ne 1 -or [int]$baseline[0].total -ne 0 -or
                [int]$latch[0].host -ne 1 -or [int]$latch[0].after -ne 1 -or [int]$latch[0].total -ne 0 -or
                [int]$end[0].host -ne 1 -or [int]$end[0].after -ne 1 -or $isolated.fields.other_valid -ne 0 -or
                $isolated.fields.unplanned -ne 0 -or [long]$assertion[0].seq -le [long]$latch[0].seq -or
                @($isolated.rows | Where-Object { [long]$_.seq -gt [long]$latch[0].seq -and [long]$_.seq -le [long]$assertion[0].seq -and
                  [int]$_.phase -eq 12 -and [int]$_.host -eq 0 }).Count) { throw 'Isolated focused baseline/latch/final or contamination evidence failed' }
            $direct = $focus.native_uia_focus_direct_interleave
            $competitors = @($direct.rows | Where-Object { [long]$_.token -ne $direct.fields.target -and [long]$_.actor -eq 2 -and
              [int]$_.origin -eq 3 -and [int]$_.action -eq 2 -and [int]$_.phase -eq 6 -and [int]$_.held -eq 1 -and
              [int]$_.expired -eq 0 -and [long]$_.hr -eq 0 -and [int]$_.before -eq 1 -and [int]$_.after -eq 2 -and
              [long]$_.seq -lt $direct.cancellationSequence })
            if ($direct.fields.other_valid -ne 1 -or $competitors.Count -ne 1) { throw 'Direct valid competing mutation not evidenced' }
            $competitorCompletion = @($direct.rows | Where-Object { [long]$_.token -eq [long]$competitors[0].token -and
              [long]$_.actor -eq 2 -and [int]$_.phase -eq 4 -and [int]$_.completion -eq 1 -and [long]$_.hr -eq 0 -and
              [int]$_.held -eq 1 -and [int]$_.expired -eq 0 -and [long]$_.seq -gt [long]$competitors[0].seq -and
              [long]$_.seq -lt $direct.cancellationSequence })
            if ($competitorCompletion.Count -ne 1) { throw 'Direct competitor actual completion missing' }

            $os = $focus.native_uia_focus_os_interleave
            $osLabel = [regex]::Match($outputs.native_uia_focus_os_interleave, 'CONTROLLED OS Value result=(-?\d+) Value_evidence=(consistent-success|consistent-timeout)')
            if (-not $osLabel.Success) { throw 'OS Value result inconclusive or missing' }
            $actual = [long]$osLabel.Groups[1].Value
            $begin = @($os.rows | Where-Object { [int]$_.phase -eq 0 -and [long]$_.actor -eq 3 -and [int]$_.origin -eq 1 -and [int]$_.stage -eq 1 })
            $returned = @($os.rows | Where-Object { [int]$_.phase -eq 0 -and [long]$_.actor -eq 3 -and [int]$_.origin -eq 1 -and [int]$_.stage -eq 2 })
            if ($begin.Count -ne 1 -or $returned.Count -ne 1 -or [long]$returned[0].hr -ne $actual -or
                [long]$begin[0].seq -ge [long]$returned[0].seq) { throw 'Actual OS call interval/HRESULT missing' }
            $submitted = @($os.rows | Where-Object { [int]$_.phase -eq 1 -and [int]$_.action -eq 1 -and [int]$_.node -eq 2 -and
              [long]$_.candidateOS -eq 3 -and [long]$_.seq -gt [long]$begin[0].seq -and [long]$_.seq -lt [long]$returned[0].seq })
            if ($submitted.Count -ne 1) { throw 'OS actual Value token missing or ambiguous' }
            $valueRows = @($os.rows | Where-Object { [long]$_.token -eq [long]$submitted[0].token })
            if (@($valueRows | Where-Object { [int]$_.action -ne 1 -or [int]$_.node -ne 2 -or [long]$_.candidateOS -ne 3 -or
                ([int]$_.phase -ge 1 -and [int]$_.phase -le 6 -and
                  ([long]$_.seq -le [long]$begin[0].seq -or [long]$_.seq -ge [long]$returned[0].seq)) -or
                [int]$_.phase -eq 3 }).Count) { throw 'Value token context/path inconsistent' }
            $queued = @($valueRows | Where-Object { [int]$_.phase -eq 2 })
            $completed = @($valueRows | Where-Object { [int]$_.phase -eq 4 -and [int]$_.completion -eq 1 -and [long]$_.hr -eq 0 -and [int]$_.expired -eq 0 })
            $mutated = @($valueRows | Where-Object { [int]$_.phase -eq 6 -and [long]$_.hr -eq 0 -and [int]$_.expired -eq 0 })
            $canceled = @($valueRows | Where-Object { [int]$_.phase -eq 5 -and [int]$_.completion -eq 2 -and [long]$_.hr -eq -2146233083 })
            if ($actual -eq 0 -and $osLabel.Groups[2].Value -eq 'consistent-success') {
              if ($completed.Count -ne 1 -or $mutated.Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 5 }).Count -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 4 }).Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 6 }).Count -ne 1 -or $queued.Count -gt 1 -or
                  [long]$submitted[0].seq -ge [long]$mutated[0].seq -or [long]$mutated[0].seq -ge [long]$completed[0].seq -or
                  [long]$completed[0].seq -ge [long]$returned[0].seq) { throw 'Actual successful Value history inconsistent' }
              if ($queued.Count -eq 1 -and ([long]$queued[0].seq -le [long]$submitted[0].seq -or [long]$queued[0].seq -ge [long]$mutated[0].seq)) { throw 'Value queued admission inconsistent' }
              if ($queued.Count -eq 0 -and ([long]$submitted[0].caller -ne [long]$submitted[0].executing -or
                  [long]$completed[0].executing -ne [long]$submitted[0].executing)) { throw 'Value direct execution not evidenced' }
            } elseif ($actual -eq -2146233083 -and $osLabel.Groups[2].Value -eq 'consistent-timeout') {
              if ($queued.Count -ne 1 -or $canceled.Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 5 }).Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -in @(4, 6) }).Count -or
                  [long]$submitted[0].seq -ge [long]$queued[0].seq -or [long]$queued[0].seq -ge [long]$canceled[0].seq -or
                  [long]$canceled[0].seq -ge [long]$returned[0].seq) { throw 'Actual queued Value timeout history inconsistent' }
            } else { throw 'Actual OS Value result and oracle disagree' }
            $result.focusEvidence = @{ isolated = $isolated.fields; direct = $direct.fields; OS = $os.fields
              osValueResult = $actual; osValueOracle = $osLabel.Groups[2].Value; osAssociation = 'candidate interval consistent' }
            foreach ($entry in $inputs.sourceHashes.PSObject.Properties) {
              if ((Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $entry.Name) -Algorithm SHA256).Hash -ne $entry.Value) { throw 'Source changed during runtime' }
            }
            if ((Get-FileHash -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe') -Algorithm SHA256).Hash -ne $compile.binary.sha256) { throw 'Executable changed during runtime' }
            if ((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash -ne $manifestHash -or (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash -ne $manifest.xmlSha256) { throw 'Manifest evidence changed during runtime' }
            $result.status = 'PASS'; $result.CI_OWN_WINDOW = 'PASS'
          } catch {
            $result.status = 'FAIL'; $result.CI_OWN_WINDOW = 'FAIL'; $result.error = $_.Exception.Message; throw
          } finally {
            $result.completedUtc = [DateTime]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDir 'test-result.json') -Encoding utf8
          }

      - name: Preserve phase results and complete logs
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          function Read-NativeLockedBytes([string]$path) {
            $stream = [IO.FileStream]::new($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            try {
              $buffer = [IO.MemoryStream]::new()
              try { $stream.CopyTo($buffer); return ,$buffer.ToArray() } finally { $buffer.Dispose() }
            } finally { $stream.Dispose() }
          }
          function Get-NativeByteHash([byte[]]$bytes) {
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          }
          function Convert-NativeUtf8([byte[]]$bytes) {
            $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
            if ($text.Length -and $text[0] -eq [char]0xFEFF) { $text = $text.Substring(1) }
            return $text
          }
          function Write-NativeNewBytes([string]$path, [byte[]]$bytes) {
            $stream = [IO.FileStream]::new($path, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $stream.Write($bytes, 0, $bytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
            $expected = Get-NativeByteHash $bytes
            if ((Get-NativeByteHash (Read-NativeLockedBytes $path)) -cne $expected) { throw 'New evidence copy differs from consumed bytes' }
            return $expected
          }
          function Save-NativeEvidenceSnapshot([string]$source, [string]$destination, [string]$name) {
            $bytes = Read-NativeLockedBytes $source
            $hash = Write-NativeNewBytes $destination $bytes
            return @{ name=$name; source=$source; destination=$destination; sha256=$hash; size=$bytes.Length; bytes=$bytes }
          }
          function Get-NativeSnapshotMetadata($snapshot) {
            return @{ name=$snapshot.name; path='ctest-consumed/' + $snapshot.name; sha256=$snapshot.sha256; size=$snapshot.size }
          }
          function Assert-NativeSnapshotsStable($snapshots) {
            foreach ($snapshot in $snapshots) {
              if ((Get-NativeByteHash (Read-NativeLockedBytes $snapshot.destination)) -cne $snapshot.sha256) {
                throw ('Consumed snapshot changed: ' + $snapshot.name)
              }
              if ((Get-NativeByteHash (Read-NativeLockedBytes $snapshot.source)) -cne $snapshot.sha256) {
                throw ('Consumed source changed: ' + $snapshot.name)
              }
            }
          }
          function Confirm-NativeInventoryProfile($inventory, $expectedTests, [string]$expectedExe, [string]$expectedDirectory) {
            if (@($inventory.tests).Count -ne 10 -or @($expectedTests).Count -ne 10) { throw 'Consumed inventory cohort differs' }
            $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            $expectedSeen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($expected in $expectedTests) {
              if (-not $expectedSeen.Add([string]$expected.name)) { throw 'Expected test identity duplicated' }
            }
            foreach ($registration in $inventory.tests) {
              if (-not $seen.Add([string]$registration.name)) { throw 'Consumed inventory test duplicated' }
              $expected = @($expectedTests | Where-Object { [string]::Equals($_.name, $registration.name, [StringComparison]::Ordinal) })
              if ($expected.Count -ne 1 -or @($registration.command).Count -ne 2 -or
                  $registration.command[1] -cne $expected[0].mode -or
                  -not [string]::Equals(([string]$registration.command[0]).Replace('\','/'), $expectedExe.Replace('\','/'), [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Consumed inventory name, executable or mode differs'
              }
              $properties = @($registration.properties)
              $timeouts = @($properties | Where-Object { $_.name -eq 'TIMEOUT' })
              $directories = @($properties | Where-Object { $_.name -eq 'WORKING_DIRECTORY' })
              if ($timeouts.Count -ne 1 -or [double]$timeouts[0].value -ne $expected[0].timeout -or
                  $directories.Count -ne 1 -or
                  -not [string]::Equals(([string]$directories[0].value).Replace('\','/'), $expectedDirectory.Replace('\','/'), [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Consumed inventory TIMEOUT or working directory differs'
              }
              if (@($properties | Where-Object { $_.name -eq 'SKIP_RETURN_CODE' -or
                    ($_.name -in @('DISABLED','WILL_FAIL') -and $_.value) }).Count) {
                throw 'Consumed inventory skip, disabled or WILL_FAIL override present'
              }
            }
            if ($seen.Count -ne $expectedSeen.Count) { throw 'Consumed inventory identities incomplete' }
          }

          function Confirm-NativeInventoryOnlyLog([byte[]]$bytes) {
            $text = Convert-NativeUtf8 $bytes
            $format = '\AStart testing: [^\r\n]+\r?\n----------------------------------------------------------\r?\nEnd testing: [^\r\n]+\r?\n\z'
            if (-not [regex]::IsMatch($text,$format)) { throw 'Inventory log contains unexpected/stale execution evidence or malformed framing' }
          }
          function Preserve-NativeInventoryLog([string]$buildDir,[string]$evidenceDir,$receipt) {
            $inventoryDir = Join-Path $evidenceDir 'ctest-inventory'
            $source = Join-Path $buildDir 'Testing/Temporary/LastTest.log'
            $snapshot = Save-NativeEvidenceSnapshot $source (Join-Path $inventoryDir 'LastTest.snapshot.log') 'LastTest.snapshot.log'
            $receipt.inventoryLogSnapshotSha256 = $snapshot.sha256
            $receipt.inventoryLogSnapshotBytes = $snapshot.size
            Confirm-NativeInventoryOnlyLog $snapshot.bytes
            if ((Get-NativeByteHash (Read-NativeLockedBytes $source)) -cne $snapshot.sha256) { throw 'Inventory-generated log changed before preserved transfer' }
            $moved = Join-Path $inventoryDir 'LastTest.moved.log'
            if (Test-Path -LiteralPath $moved) { throw 'Inventory transfer destination already exists' }
            $expectedSource = [IO.Path]::GetFullPath((Join-Path $buildDir 'Testing/Temporary/LastTest.log'))
            $expectedDestination = [IO.Path]::GetFullPath((Join-Path $evidenceDir 'ctest-inventory/LastTest.moved.log'))
            if (-not [string]::Equals([IO.Path]::GetFullPath($source),$expectedSource,[StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals([IO.Path]::GetFullPath($moved),$expectedDestination,[StringComparison]::OrdinalIgnoreCase)) { throw 'Inventory transfer path escaped exact admitted boundary' }
            Move-Item -LiteralPath $source -Destination $moved
            $movedHash = Get-NativeByteHash (Read-NativeLockedBytes $moved)
            $receipt.inventoryLogMovedSha256 = $movedHash
            if ($movedHash -cne $snapshot.sha256 -or (Test-Path -LiteralPath $source)) { throw 'Inventory source transfer drift or original path remains' }
            $receipt.inventoryLogTransferred = $true
          }
          function Confirm-NativeArchivedInventory([string]$evidenceDir,$receipt) {
            if ($receipt.status -cne 'PASS' -or $receipt.inventoryExit -ne 0 -or $receipt.count -ne 10 -or
                $receipt.preInventoryLogAbsent -isnot [bool] -or -not $receipt.preInventoryLogAbsent -or
                $receipt.inventoryLogTransferred -isnot [bool] -or -not $receipt.inventoryLogTransferred) { throw 'Qualified inventory freshness boundary missing' }
            foreach ($entry in @(
                @{path='ctest-inventory/LastTest.snapshot.log';hash=$receipt.inventoryLogSnapshotSha256;inventoryLog=$true},
                @{path='ctest-inventory/LastTest.moved.log';hash=$receipt.inventoryLogMovedSha256;inventoryLog=$true},
                @{path='ctest-inventory/test-inventory.json';hash=$receipt.inventoryJsonSnapshotSha256;inventoryLog=$false},
                @{path='test-inventory.json';hash=$receipt.inventoryJsonSnapshotSha256;inventoryLog=$false})) {
              $bytes = Read-NativeLockedBytes (Join-Path $evidenceDir $entry.path)
              if (-not $entry.hash -or (Get-NativeByteHash $bytes) -cne $entry.hash) { throw 'Qualified inventory preserved/current bytes drifted' }
              if ($entry.inventoryLog) { Confirm-NativeInventoryOnlyLog $bytes }
            }
            if ($receipt.inventoryLogSnapshotSha256 -cne $receipt.inventoryLogMovedSha256) { throw 'Inventory preserved transfer hashes differ' }
          }
          function Confirm-NativePreExecutionInventory([string]$buildDir,[string]$evidenceDir,[string]$manifestHash) {
            $receiptBytes = Read-NativeLockedBytes (Join-Path $evidenceDir 'inventory-check.json')
            $receipt = (Convert-NativeUtf8 $receiptBytes) | ConvertFrom-Json
            Confirm-NativeInventoryPhaseBinding $evidenceDir (Get-NativeByteHash $receiptBytes)
            if ($receipt.embeddedManifestVerificationSha256 -cne $manifestHash) { throw 'Inventory freshness manifest binding differs' }
            Confirm-NativeArchivedInventory $evidenceDir $receipt
            if (Test-Path -LiteralPath (Join-Path $buildDir 'Testing/Temporary/LastTest.log')) { throw 'Unexpected native execution log after qualified inventory transfer' }
            return @{ receipt=$receipt; receiptSha256=(Get-NativeByteHash $receiptBytes) }
          }
          function Write-NativeInventoryPhaseEvidence([string]$evidenceDir,[string]$inventoryDir,[bool]$created,$receipt) {
            $phaseBytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json -Depth 8))
            $phaseHash = Write-NativeNewBytes (Join-Path $evidenceDir 'inventory-check.json') $phaseBytes
            if (-not $created) { return }
            $null = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-receipt.json') $phaseBytes
            $binding = @{ phaseReceiptSha256=$phaseHash; phaseStatus=$receipt.status; archiveHashes=@{
              'LastTest.snapshot.log'=$receipt.inventoryLogSnapshotSha256
              'LastTest.moved.log'=$receipt.inventoryLogMovedSha256
              'test-inventory.json'=$receipt.inventoryJsonSnapshotSha256 } }
            $bindingBytes = [Text.UTF8Encoding]::new($false).GetBytes(($binding | ConvertTo-Json -Depth 8))
            $bindingHash = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-binding.json') $bindingBytes
            $null = Write-NativeNewBytes (Join-Path $inventoryDir 'phase-binding.sha256') ([Text.Encoding]::ASCII.GetBytes($bindingHash+"`n"))
          }
          function Confirm-NativeInventoryPhaseBinding([string]$evidenceDir,[string]$expectedCurrentHash) {
            $directory = Join-Path $evidenceDir 'ctest-inventory'
            $bindingBytes = Read-NativeLockedBytes (Join-Path $directory 'phase-binding.json')
            $digest = Convert-NativeUtf8 (Read-NativeLockedBytes (Join-Path $directory 'phase-binding.sha256'))
            if ($digest -notmatch '\A[0-9A-F]{64}\n\z' -or (Get-NativeByteHash $bindingBytes) -cne $digest.TrimEnd("`n")) { throw 'Inventory phase-binding bytes changed/unbound' }
            $binding = (Convert-NativeUtf8 $bindingBytes) | ConvertFrom-Json
            $snapshotHash = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $directory 'phase-receipt.json'))
            $currentHash = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir 'inventory-check.json'))
            if ($snapshotHash -cne $binding.phaseReceiptSha256 -or $currentHash -cne $snapshotHash -or $currentHash -cne $expectedCurrentHash) { throw 'Inventory phase receipt bytes changed/unbound' }
          }
          function Observe-NativeInventoryPhaseRetention([string]$evidenceDir,$collection) {
            # Inspect all available inputs even if no preExecutionInventory return was recorded.
            $directory = Join-Path $evidenceDir 'ctest-inventory'
            $sources = @(
              @{name='inventory-check.current.json';source=(Join-Path $evidenceDir 'inventory-check.json')},
              @{name='test-inventory.current.json';source=(Join-Path $evidenceDir 'test-inventory.json')},
              @{name='phase-receipt.json';source=(Join-Path $directory 'phase-receipt.json')},
              @{name='phase-binding.json';source=(Join-Path $directory 'phase-binding.json')},
              @{name='phase-binding.sha256';source=(Join-Path $directory 'phase-binding.sha256')},
              @{name='LastTest.snapshot.log';source=(Join-Path $directory 'LastTest.snapshot.log')},
              @{name='LastTest.moved.log';source=(Join-Path $directory 'LastTest.moved.log')},
              @{name='test-inventory.json';source=(Join-Path $directory 'test-inventory.json')})
            $available = @($sources | Where-Object { Test-Path -LiteralPath $_.source -PathType Leaf })
            $observation = @{phaseStatus='NOT_RUN';qualified=$false;captures=@();checks=@()}
            $collection.inventoryPhaseObservation = $observation
            if ($available.Count -eq 0) { return }
            $snapshots = @{}
            $finalDirectory = Join-Path $evidenceDir 'ctest-final/inventory-archive'
            $copyDirectoryCreated = $false
            try { New-Item -ItemType Directory -Path $finalDirectory | Out-Null; $copyDirectoryCreated = $true }
            catch { $collection.errors += 'Inventory phase final-copy directory unavailable: '+$_.Exception.Message }
            foreach ($source in $sources) {
              if (-not (Test-Path -LiteralPath $source.source -PathType Leaf)) {
                $observation.captures += @{name=$source.name;status='NOT_AVAILABLE'}
                continue
              }
              try {
                $bytes = Read-NativeLockedBytes $source.source
                $snapshot = @{name=$source.name;bytes=$bytes;sha256=(Get-NativeByteHash $bytes);size=$bytes.Length}
                $snapshots[$source.name] = $snapshot
                $copyStatus = 'COPY_UNAVAILABLE'
                if ($copyDirectoryCreated) {
                  try { $null = Write-NativeNewBytes (Join-Path $finalDirectory $source.name) $bytes; $copyStatus = 'CAPTURED' }
                  catch { $collection.errors += 'Inventory phase final-copy failed for '+$source.name+': '+$_.Exception.Message }
                }
                $observation.captures += @{name=$source.name;status=$copyStatus;sha256=$snapshot.sha256;size=$snapshot.size;path=if($copyStatus -ceq 'CAPTURED'){'ctest-final/inventory-archive/'+$source.name}else{$null}}
              } catch { $collection.errors += 'Inventory phase capture failed for '+$source.name+': '+$_.Exception.Message }
            }
            $binding = $null
            $bindingTrusted = $false
            if ($snapshots.ContainsKey('phase-binding.json')) {
              try { $binding = (Convert-NativeUtf8 $snapshots['phase-binding.json'].bytes) | ConvertFrom-Json }
              catch { $collection.errors += 'Inventory phase-binding JSON invalid: '+$_.Exception.Message }
            }
            if ($binding -and $snapshots.ContainsKey('phase-binding.sha256')) {
              $digest = Convert-NativeUtf8 $snapshots['phase-binding.sha256'].bytes
              $bindingTrusted = $digest -match '\A[0-9A-F]{64}\n\z' -and $snapshots['phase-binding.json'].sha256 -ceq $digest.TrimEnd("`n")
            }
            if (-not $bindingTrusted) { $collection.errors += 'Inventory phase binding missing, invalid or changed' }
            $observation.bindingTrusted = $bindingTrusted
            $expected = @{}
            if ($binding) {
              $expected['phase-receipt.json'] = $binding.phaseReceiptSha256
              $expected['inventory-check.current.json'] = $binding.phaseReceiptSha256
              foreach ($name in @('LastTest.snapshot.log','LastTest.moved.log','test-inventory.json')) { $expected[$name] = $binding.archiveHashes.$name }
              $expected['test-inventory.current.json'] = $binding.archiveHashes.'test-inventory.json'
            }
            foreach ($name in @('phase-receipt.json','inventory-check.current.json','LastTest.snapshot.log','LastTest.moved.log','test-inventory.json','test-inventory.current.json')) {
              $hash = $expected[$name]
              $present = $snapshots.ContainsKey($name)
              $known = $hash -is [string] -and $hash -match '\A[0-9A-Fa-f]{64}\z'
              $matched = $present -and $known -and $snapshots[$name].sha256 -eq $hash
              $observation.checks += @{name=$name;present=$present;expectedHashKnown=$known;expectedSha256=$hash;actualSha256=if($present){$snapshots[$name].sha256}else{$null};hashMatched=$matched;bindingTrusted=$bindingTrusted}
              if ($present -and -not $known) { $collection.errors += 'Available inventory phase/archive bytes are unbound: '+$name }
              elseif ($known -and -not $matched) { $collection.errors += 'Inventory phase/archive bytes missing or changed: '+$name }
            }
            $phase = $null
            $phaseSource = if ($snapshots.ContainsKey('phase-receipt.json')) { 'phase-receipt.json' } elseif ($snapshots.ContainsKey('inventory-check.current.json')) { 'inventory-check.current.json' } else { $null }
            if ($phaseSource) {
              try { $phase = (Convert-NativeUtf8 $snapshots[$phaseSource].bytes) | ConvertFrom-Json; $observation.phaseStatus=$phase.status }
              catch { $observation.phaseStatus='INVALID';$collection.errors += 'Inventory phase receipt JSON invalid: '+$_.Exception.Message }
            } else { $observation.phaseStatus='MISSING';$collection.errors += 'Inventory phase receipt missing beside available inputs' }
            if ($observation.phaseStatus -cne 'PASS') { $collection.errors += 'Inventory phase failed or partial: '+$observation.phaseStatus }
            if ($phase -and $phase.status -ceq 'PASS') {
              if ($phase.inventoryExit -ne 0 -or $phase.count -ne 10 -or $phase.preInventoryLogAbsent -isnot [bool] -or -not $phase.preInventoryLogAbsent -or
                  $phase.inventoryLogTransferred -isnot [bool] -or -not $phase.inventoryLogTransferred) { $collection.errors += 'Inventory phase completeness/freshness facts invalid' }
              foreach ($name in @('phase-receipt.json','inventory-check.current.json','LastTest.snapshot.log','LastTest.moved.log','test-inventory.json','test-inventory.current.json')) {
                if (-not $snapshots.ContainsKey($name) -or -not $expected[$name]) { $collection.errors += 'Successful inventory phase is incomplete/unbound: '+$name }
              }
            }
            # Captures/checks do not promote any failed/partial phase or establish native execution.
          }
          $temporary = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release/Testing/Temporary'
          $collection = @{ status='RUNNING'; finalSources=@(); consumedChecks=@(); driftedInputs=@(); errors=@() }
          $test = $null
          $testPath = Join-Path $evidenceDir 'test-result.json'
          if (Test-Path -LiteralPath $testPath -PathType Leaf) {
            try {
              $testBytes = Read-NativeLockedBytes $testPath
              $collection.testResultSha256 = Get-NativeByteHash $testBytes
              $test = (Convert-NativeUtf8 $testBytes) | ConvertFrom-Json
            } catch { $collection.errors += 'Cannot read stable test-result bytes: ' + $_.Exception.Message }
          }
          $finalByName = @{}
          try {
            $finalLogDir = Join-Path $evidenceDir 'ctest-final'
            New-Item -ItemType Directory -Path $finalLogDir | Out-Null
            $finalSources = @(
              @{ name='inventory-check.json'; source=(Join-Path $evidenceDir 'inventory-check.json'); relative='inventory-check.json' },
              @{ name='test-inventory.json'; source=(Join-Path $evidenceDir 'test-inventory.json'); relative='test-inventory.json' },
              @{ name='ctest-junit.xml'; source=(Join-Path $evidenceDir 'ctest-junit.xml'); relative='ctest-junit.xml' }
            )
            if (Test-Path -LiteralPath $temporary -PathType Container) {
              foreach ($entry in Get-ChildItem -LiteralPath $temporary -Recurse -File -Force) {
                $relative = [IO.Path]::GetRelativePath($temporary, $entry.FullName).Replace('\','/')
                $finalSources += @{ name=if ($relative -ceq 'LastTest.log') { 'LastTest.log' } else { 'temporary/' + $relative }
                  source=$entry.FullName; relative=if ($relative -ceq 'LastTest.log') { 'LastTest.log' } else { 'temporary/' + $relative } }
              }
            }
            foreach ($source in $finalSources) {
              if (-not (Test-Path -LiteralPath $source.source -PathType Leaf)) {
                $collection.finalSources += @{ name=$source.name; status='NOT_OBSERVED' }
                continue
              }
              try {
                $destination = Join-Path $finalLogDir $source.relative
                New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($destination)) -Force | Out-Null
                $snapshot = Save-NativeEvidenceSnapshot $source.source $destination $source.name
                $metadata = @{ name=$source.name; path='ctest-final/' + $source.relative; sha256=$snapshot.sha256; size=$snapshot.size; status='CAPTURED' }
                $collection.finalSources += $metadata
                $finalByName[$source.name] = $metadata
              } catch { $collection.errors += 'Final source capture failed for ' + $source.name + ': ' + $_.Exception.Message }
            }
            foreach ($record in @($test.evidenceExtraction.snapshots)) {
              if ($null -eq $record) { continue }
              if ($record.name -cnotin @('inventory-check.json','test-inventory.json','ctest-junit.xml','LastTest.log') -or
                  $record.path -cne ('ctest-consumed/' + $record.name)) {
                $collection.errors += 'Consumed snapshot metadata identity differs'
                continue
              }
              try {
                $actual = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir $record.path))
                $collection.consumedChecks += @{ name=$record.name; expectedSha256=$record.sha256; actualSha256=$actual; preserved=$actual -ceq $record.sha256 }
                if ($actual -cne $record.sha256) { $collection.errors += 'Consumed snapshot drift: ' + $record.name }
                if (-not $finalByName.ContainsKey($record.name) -or $finalByName[$record.name].sha256 -cne $record.sha256) {
                  $collection.driftedInputs += $record.name
                  $collection.errors += 'Final source absent or differs from consumed bytes: ' + $record.name
                }
              } catch { $collection.errors += 'Consumed snapshot check failed for ' + $record.name + ': ' + $_.Exception.Message }
            }
            if ($test.evidenceExtraction.captureManifestSha256) {
              try {
                $actual = Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir 'ctest-consumed/manifest.json'))
                $collection.consumedManifestSha256 = $actual
                if ($actual -cne $test.evidenceExtraction.captureManifestSha256) { $collection.errors += 'Consumed capture manifest drift' }
              } catch { $collection.errors += 'Consumed capture manifest unavailable: ' + $_.Exception.Message }
            }
            foreach ($record in @($test.evidenceExtraction.records)) {
              if ($null -eq $record) { continue }
              try {
                if ($record.name -notmatch '^native_uia_[a-z_]+$' -or $record.path -cne ('native-case-output/' + $record.name + '.log')) { throw 'Derived output identity differs' }
                if ((Get-NativeByteHash (Read-NativeLockedBytes (Join-Path $evidenceDir $record.path))) -cne $record.sha256) { throw 'Derived output differs from consumed bytes' }
              } catch { $collection.errors += 'Derived output check failed: ' + $_.Exception.Message }
            }
          } catch { $collection.errors += 'Final collection failed: ' + $_.Exception.Message }
          try { Observe-NativeInventoryPhaseRetention $evidenceDir $collection }
          catch { $collection.errors += 'Inventory phase/archive observation failed: ' + $_.Exception.Message }
          $collection.status = if ($collection.errors.Count) { 'FAIL' } else { 'PASS' }
          $collectionBytes = [Text.UTF8Encoding]::new($false).GetBytes(($collection | ConvertTo-Json -Depth 10))
          $collectionHash = Write-NativeNewBytes (Join-Path $evidenceDir 'ctest-retention.json') $collectionBytes

          $final = [ordered]@{ MSVC_COMPILE = 'NOT_RUN'; CI_OWN_WINDOW = 'NOT_RUN'
            ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'; ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED'
            checkoutSha = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            evidence = @(); warningDiagnosticLineCount = $null; D9025LineCount = $null }
          $final.EVIDENCE_RETENTION = $collection.status
          $final.ctestRetentionReceiptSha256 = $collectionHash
          $final.testResultConsumedSha256 = $collection.testResultSha256
          $final.ctestConsumedManifestObservedSha256 = $collection.consumedManifestSha256
          $compilePath = Join-Path $evidenceDir 'compile.json'
          if (Test-Path -LiteralPath $compilePath) {
            $compile = Get-Content -LiteralPath $compilePath -Raw | ConvertFrom-Json
            $final.MSVC_COMPILE = $compile.status
            $final.warningDiagnosticLineCount = $compile.warningDiagnosticLineCount
            $final.D9025LineCount = $compile.D9025LineCount
          }
          $contextPath = Join-Path $evidenceDir 'context.json'
          if (Test-Path -LiteralPath $contextPath) { $final.CI_OWN_WINDOW = (Get-Content -LiteralPath $contextPath -Raw | ConvertFrom-Json).CI_OWN_WINDOW }
          if ($test) { $final.CI_OWN_WINDOW = $test.CI_OWN_WINDOW }
          $manifestPath = Join-Path $evidenceDir 'embedded-manifest-verification.json'
          $final.EMBEDDED_MANIFEST = 'NOT_RUN'
          $final.ASSEMBLY_IDENTITY = 'NOT_RUN'
          if (Test-Path -LiteralPath $manifestPath) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $final.EMBEDDED_MANIFEST = $manifest.status
            $final.embeddedManifestVerificationSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
            $final.embeddedManifestXmlSha256 = $manifest.xmlSha256
            $final.embeddedManifestBinarySha256 = $manifest.binarySha256Before
            $final.ASSEMBLY_IDENTITY = $manifest.assemblyIdentityValidation; $final.expectedAssemblyIdentity = $manifest.expectedAssemblyIdentity
            $final.generatedAssemblyIdentity = $manifest.generatedAssemblyIdentity; $final.extractedAssemblyIdentity = $manifest.extractedAssemblyIdentity
          }
          foreach ($file in Get-ChildItem -LiteralPath $evidenceDir -Recurse -File) {
            $final.evidence += @{ path = [IO.Path]::GetRelativePath($evidenceDir, $file.FullName); sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash; size = $file.Length }
          }
          $final | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDir 'final-status.json') -Encoding utf8
          if ($final.MSVC_COMPILE -eq 'PASS' -and $final.CI_OWN_WINDOW -eq 'PASS' -and $final.EVIDENCE_RETENTION -eq 'PASS') {
            "Standalone Native UIA MSVC Release compile qualified; ten CI own-window cases passed at this recorded runner context. Compiler diagnostic lines: $($final.warningDiagnosticLineCount), including D9025: $($final.D9025LineCount). Root-owned MSVC diagnostic adjudication pending the exact artifact. Actual NSTU / AT / TextPattern / IME / DPI / physical NOT TESTED." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Standalone Native UIA evidence: MSVC_COMPILE=$($final.MSVC_COMPILE), CI_OWN_WINDOW=$($final.CI_OWN_WINDOW), EVIDENCE_RETENTION=$($final.EVIDENCE_RETENTION). Compiler diagnostic lines: $($final.warningDiagnosticLineCount), including D9025: $($final.D9025LineCount). Failed/unexecuted phases remain unqualified. Actual NSTU / AT / physical NOT TESTED." >> $env:GITHUB_STEP_SUMMARY
          }
          if ($collection.status -cne 'PASS') { throw 'Native evidence retention failed; original consumed and final snapshots preserved' }

      - name: Upload qualification evidence and exact MSVC probe package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-uia-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-uia-msvc-evidence/
          if-no-files-found: error
          retention-days: 14
