name: Standalone Native UIA MSVC

on:
  push:
    paths:
      - 'tools/native-uia-probe/**'
      - '.github/workflows/native-uia-msvc.yml'
  pull_request:
    paths:
      - 'tools/native-uia-probe/**'
      - '.github/workflows/native-uia-msvc.yml'

permissions:
  contents: read

jobs:
  native-uia-msvc:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify frozen standalone inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          New-Item -ItemType Directory -Path $evidenceDir | Out-Null
          $inputs = [ordered]@{
            status = 'RUNNING'
            startedUtc = [DateTime]::UtcNow.ToString('o')
            checkoutSha = $null
            workflowSha256 = (Get-FileHash -LiteralPath '.github/workflows/native-uia-msvc.yml' -Algorithm SHA256).Hash
            event = $env:GITHUB_EVENT_NAME
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            sourceHashes = [ordered]@{}
            expectedSourceHashes = [ordered]@{
              'tools/native-uia-probe/main.cpp' = '04D64CA99477CA1A4CE26C8DC017CD3F085C5D56B7FA8E2139937D0907A7E5E6'
              'tools/native-uia-probe/tests.cpp' = 'F0AF05868F66B1B6ECE6C9DD85823872352DD6BC67C5C2D4373CD07A415B6121'
              'tools/native-uia-probe/CMakeLists.txt' = 'C723FC39AFE43BE99AD4104B0C7A812EB93378333CEA6A02AC4E534E07857388'
              'tools/native-uia-probe/README.md' = '309A6EB16479C7B5EBC603C7961AE3848670F67518D7469204986977F6A5E67E'
            }
            expectedTests = @(
              @{ name = 'native_uia_own_window'; mode = '--self-test'; timeout = 90 }
              @{ name = 'native_uia_fault_paths'; mode = '--fault-test'; timeout = 75 }
              @{ name = 'native_uia_delayed_start'; mode = '--regression-idle'; timeout = 30 }
              @{ name = 'native_uia_event_exception'; mode = '--regression-event'; timeout = 30 }
              @{ name = 'native_uia_diagnostic_lock'; mode = '--regression-diagnostic'; timeout = 30 }
              @{ name = 'native_uia_retained_metadata'; mode = '--regression-metadata'; timeout = 30 }
              @{ name = 'native_uia_retirement_containment'; mode = '--retirement-test'; timeout = 30 }
              @{ name = 'native_uia_focus_isolated'; mode = '--focus-isolated-test'; timeout = 30 }
              @{ name = 'native_uia_focus_direct_interleave'; mode = '--focus-competing-test'; timeout = 30 }
              @{ name = 'native_uia_focus_os_interleave'; mode = '--focus-os-interleave-test'; timeout = 30 }
            )
            MSVC_COMPILE = 'NOT_RUN'
            CI_OWN_WINDOW = 'NOT_RUN'
            ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'
            ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED'
          }
          try {
            $head = & git rev-parse HEAD
            $headExit = $LASTEXITCODE
            if ($headExit -ne 0 -or $head -notmatch '^[0-9a-f]{40}$') { throw 'Cannot identify checkout commit' }
            $inputs.checkoutSha = $head
            if ($head -ne $env:GITHUB_SHA) { throw 'Checkout commit differs from workflow event SHA' }
            foreach ($entry in $inputs.expectedSourceHashes.GetEnumerator()) {
              $actual = (Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash
              $inputs.sourceHashes[$entry.Key] = $actual
              if ($actual -ne $entry.Value) { throw "Frozen source mismatch: $($entry.Key)" }
            }
            $text = Get-Content -LiteralPath 'tools/native-uia-probe/tests.cpp' -Raw
            if ($text -notmatch '#ifdef NDEBUG\s+#error Release checks must remain active\s+#endif') {
              throw 'Existing tests.cpp active-assertion compile guard missing'
            }
            $inputs.activeAssertionGuard = 'tools/native-uia-probe/tests.cpp'
            $inputs.status = 'PASS'
          } catch {
            $inputs.status = 'FAIL'
            $inputs.error = $_.Exception.Message
            throw
          } finally {
            $inputs | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDir 'inputs.json') -Encoding utf8
          }

      - name: Compile actual standalone MSVC Release and bind artifact
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $inputs = Get-Content -LiteralPath (Join-Path $evidenceDir 'inputs.json') -Raw | ConvertFrom-Json
          $compile = [ordered]@{
            status = 'RUNNING'; phase = 'toolchain'; configureExit = $null; buildExit = $null
            startedUtc = [DateTime]::UtcNow.ToString('o'); checkoutSha = $inputs.checkoutSha
            workflowSha256 = $inputs.workflowSha256; sourceHashes = $inputs.sourceHashes
            imageOS = $env:ImageOS; imageVersion = $env:ImageVersion
            OS = [Environment]::OSVersion.VersionString
            warningDiagnosticLineCount = $null; warningDiagnostics = @(); D9025LineCount = $null
            warningPolicy = 'Unchanged /W4 /WX; retain every diagnostic including NDEBUG override D9025'
          }
          try {
            if ($inputs.status -ne 'PASS') { throw 'Frozen inputs not verified' }
            & cmake --version *> (Join-Path $evidenceDir 'cmake-version.log')
            $cmakeVersionExit = $LASTEXITCODE
            if ($cmakeVersionExit -ne 0) { throw 'CMake version unavailable' }
            $cmakeVersionText = Get-Content -LiteralPath (Join-Path $evidenceDir 'cmake-version.log') -Raw
            $versionMatch = [regex]::Match($cmakeVersionText, 'cmake version (\d+\.\d+\.\d+)')
            if (-not $versionMatch.Success -or [version]$versionMatch.Groups[1].Value -lt [version]'3.25') {
              throw 'CMake 3.25 or newer required'
            }
            $compile.cmakeVersion = $versionMatch.Groups[1].Value
            & ctest --version *> (Join-Path $evidenceDir 'ctest-version.log')
            $ctestVersionExit = $LASTEXITCODE
            if ($ctestVersionExit -ne 0) { throw 'CTest version unavailable' }
            $compile.ctestVersion = (Get-Content -LiteralPath (Join-Path $evidenceDir 'ctest-version.log') -Raw).Trim()
            $uia = Get-Item -LiteralPath (Join-Path $env:SystemRoot 'System32/UIAutomationCore.dll')
            $compile.UIAutomationCore = @{ version = $uia.VersionInfo.FileVersion; sha256 = (Get-FileHash -LiteralPath $uia.FullName -Algorithm SHA256).Hash }

            $compile.phase = 'configure'
            & cmake -S tools/native-uia-probe -B $buildDir -G 'Visual Studio 17 2022' -A x64 -T host=x64 `
              -DCMAKE_CONFIGURATION_TYPES=Release *> (Join-Path $evidenceDir 'configure.log')
            $compile.configureExit = $LASTEXITCODE
            if ($compile.configureExit -ne 0) { throw "Standalone configure failed: $($compile.configureExit)" }
            $compile.phase = 'settings'
            $cache = Get-Content -LiteralPath (Join-Path $buildDir 'CMakeCache.txt') -Raw
            if ($cache -notmatch '(?m)^CMAKE_GENERATOR:INTERNAL=Visual Studio 17 2022\r?$' -or
                $cache -notmatch '(?m)^CMAKE_GENERATOR_PLATFORM:INTERNAL=x64\r?$' -or
                $cache -notmatch '(?m)^CMAKE_CONFIGURATION_TYPES:[^=]+=Release\r?$') { throw 'Wrong generator, target or configuration' }
            $compilerFiles = @(Get-ChildItem -LiteralPath (Join-Path $buildDir 'CMakeFiles') -Filter CMakeCXXCompiler.cmake -Recurse -File)
            if ($compilerFiles.Count -ne 1) { throw 'MSVC compiler identity missing or ambiguous' }
            $compilerText = Get-Content -LiteralPath $compilerFiles[0].FullName -Raw
            if ($compilerText -notmatch 'set\(CMAKE_CXX_COMPILER_ID "MSVC"\)') { throw 'Compiler is not MSVC' }
            $compilerMatch = [regex]::Match($compilerText, 'set\(CMAKE_CXX_COMPILER "([^"]+)"\)')
            if (-not $compilerMatch.Success) { throw 'MSVC compiler path unavailable' }
            $cl = Get-Item -LiteralPath $compilerMatch.Groups[1].Value
            if ($cl.Name -ne 'cl.exe' -or $cl.FullName -notmatch '[\\/]Hostx64[\\/]x64[\\/]cl\.exe$') { throw 'MSVC host/target are not x64' }
            $compile.compiler = @{ path = $cl.FullName; version = $cl.VersionInfo.FileVersion; sha256 = (Get-FileHash -LiteralPath $cl.FullName -Algorithm SHA256).Hash }
            $projectPath = Join-Path $buildDir 'nstu-native-uia-probe.vcxproj'
            [xml]$project = Get-Content -LiteralPath $projectPath -Raw
            $translationUnits = @($project.SelectNodes('//*[local-name()="ClCompile" and @Include]') |
              ForEach-Object { [IO.Path]::GetFileName($_.GetAttribute('Include')) } | Sort-Object)
            if ($translationUnits.Count -ne 2 -or ($translationUnits -join ',') -ne 'main.cpp,tests.cpp') {
              throw 'Actual frozen main.cpp and tests.cpp target compilation not verified'
            }
            $releaseGroups = @($project.SelectNodes('//*[local-name()="ItemDefinitionGroup"]') | Where-Object { $_.Condition -match 'Release\|x64' })
            if ($releaseGroups.Count -ne 1) { throw 'Release x64 compile configuration ambiguous' }
            $settings = $releaseGroups[0].ClCompile
            $options = [string]$settings.AdditionalOptions
            $undefined = [string]$settings.UndefinePreprocessorDefinitions
            if ([string]$settings.WarningLevel -ne 'Level4' -or [string]$settings.TreatWarningAsError -ne 'true' -or
                [string]$settings.LanguageStandard -ne 'stdcpp20' -or [string]$settings.RuntimeLibrary -ne 'MultiThreaded' -or
                [string]$settings.Optimization -ne 'MaxSpeed' -or
                ([string]$settings.ConformanceMode -ne 'true' -and $options -notmatch '/permissive-') -or
                $options -notmatch '/utf-8' -or ($undefined -notmatch '(^|;)NDEBUG(;|$)' -and $options -notmatch '/UNDEBUG')) {
              throw 'Strict MSVC/Release/static-CRT/active-assertion settings not verified'
            }
            $compile.settings = @{ WarningLevel = [string]$settings.WarningLevel; TreatWarningAsError = [string]$settings.TreatWarningAsError
              LanguageStandard = [string]$settings.LanguageStandard; RuntimeLibrary = [string]$settings.RuntimeLibrary
              Optimization = [string]$settings.Optimization; ConformanceMode = [string]$settings.ConformanceMode
              AdditionalOptions = $options; UndefinePreprocessorDefinitions = $undefined }
            $compile.translationUnits = $translationUnits
            $compile.activeAssertionsProof = 'Existing tests.cpp compile guard; target NDEBUG undefinition applies to both frozen translation units'
            $compile.WindowsSDK = $project.SelectSingleNode('//*[local-name()="WindowsTargetPlatformVersion"]').InnerText
            $compile.PlatformToolset = @($project.SelectNodes('//*[local-name()="PlatformToolset"]') | ForEach-Object { $_.InnerText } | Sort-Object -Unique)
            function Split-NativeArguments([string]$text) {
              $arguments = [Collections.Generic.List[string]]::new(); $index = 0
              while ($index -lt $text.Length) {
                while ($index -lt $text.Length -and [char]::IsWhiteSpace($text[$index])) { ++$index }
                if ($index -ge $text.Length) { break }
                $value = [Text.StringBuilder]::new(); $quoted = $false
                while ($index -lt $text.Length) {
                  $character = $text[$index]
                  if (-not $quoted -and [char]::IsWhiteSpace($character)) { break }
                  if ($character -eq '\') {
                    $slashes = 0
                    while ($index -lt $text.Length -and $text[$index] -eq '\') { ++$slashes; ++$index }
                    if ($index -lt $text.Length -and $text[$index] -eq '"') {
                      [void]$value.Append('\', [int][Math]::Floor($slashes / 2))
                      if ($slashes % 2) { [void]$value.Append('"'); ++$index } else { $quoted = -not $quoted; ++$index }
                    } else { [void]$value.Append('\', $slashes) }
                    continue
                  }
                  if ($character -eq '"') {
                    if ($quoted -and $index + 1 -lt $text.Length -and $text[$index + 1] -eq '"') { [void]$value.Append('"'); $index += 2 }
                    else { $quoted = -not $quoted; ++$index }
                    continue
                  }
                  [void]$value.Append($character); ++$index
                }
                if ($quoted) { throw 'Unterminated quote in actual native tool command' }
                $arguments.Add($value.ToString())
              }
              return ,$arguments.ToArray()
            }
            function Read-ActualCommand([string[]]$lines, [string]$tool) {
              $commandMatches = @()
              for ($lineIndex = 0; $lineIndex -lt $lines.Count; ++$lineIndex) {
                $text = ($lines[$lineIndex] -replace '^\s*\d+>', '').TrimStart()
                $prefix = if ($text.StartsWith('"')) { '"' + $tool + '"' } else { $tool }
                if (-not $text.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or
                    $text.Length -le $prefix.Length -or -not [char]::IsWhiteSpace($text[$prefix.Length])) { continue }
                $commandLines = [Collections.Generic.List[string]]::new(); $commandLines.Add($lines[$lineIndex])
                $argumentText = $text.Substring($prefix.Length)
                for ($next = $lineIndex + 1; $next -lt $lines.Count; ++$next) {
                  $continuation = $lines[$next].Trim()
                  if ($continuation -notmatch '^"[^"]+\.(obj|res|rsp)"\s*$' -and $continuation -notmatch '^@"[^"]+\.rsp"\s*$') { break }
                  $argumentText += ' ' + $continuation; $commandLines.Add($lines[$next])
                }
                $commandMatches += @{ arguments = (Split-NativeArguments $argumentText); text = ($commandLines -join [Environment]::NewLine) }
              }
              if ($commandMatches.Count -ne 1) { throw 'Actual native tool command missing or ambiguous' }
              return $commandMatches[0]
            }
            $responseFiles = [Collections.Generic.List[object]]::new()
            $responseSeen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            function Expand-LinkResponses([string[]]$arguments, [int]$depth = 0) {
              if ($depth -gt 4) { throw 'Link response nesting exceeds bound' }
              $expanded = [Collections.Generic.List[string]]::new()
              foreach ($argument in $arguments) {
                if (-not $argument.StartsWith('@')) { $expanded.Add($argument); continue }
                $responsePath = [IO.Path]::GetFullPath($argument.Substring(1), $buildDir)
                $prefix = [IO.Path]::GetFullPath($buildDir).TrimEnd('\','/') + [IO.Path]::DirectorySeparatorChar
                if (-not $responsePath.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or
                    -not $responseSeen.Add($responsePath) -or $responseSeen.Count -gt 16) { throw 'Response file is outside owned build or repeated/oversized' }
                $file = Get-Item -LiteralPath $responsePath
                if ($file.Length -gt 1048576) { throw 'Response file byte bound exceeded' }
                $bytes = [IO.File]::ReadAllBytes($responsePath)
                if ($bytes.Length -ge 2 -and $bytes[0] -eq 255 -and $bytes[1] -eq 254) {
                  $decoder = [Text.UnicodeEncoding]::new($false, $true, $true); $responseText = $decoder.GetString($bytes, 2, $bytes.Length - 2)
                } else {
                  $decoder = [Text.UTF8Encoding]::new($false, $true); $offset = if ($bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191) { 3 } else { 0 }
                  $responseText = $decoder.GetString($bytes, $offset, $bytes.Length - $offset)
                }
                $copy = Join-Path $evidenceDir ('link-response-' + ($responseFiles.Count + 1) + '.rsp')
                Copy-Item -LiteralPath $responsePath -Destination $copy
                $hash = (Get-FileHash -LiteralPath $responsePath -Algorithm SHA256).Hash
                if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash -ne $hash) { throw 'Retained response file differs' }
                $responseFiles.Add(@{ source = $responsePath; artifact = [IO.Path]::GetFileName($copy); sha256 = $hash; bytes = $bytes.Length })
                foreach ($nested in (Expand-LinkResponses (Split-NativeArguments $responseText) ($depth + 1))) { $expanded.Add($nested) }
              }
              return ,$expanded.ToArray()
            }
            $generatedManifest = Join-Path $buildDir 'probe.manifest'
            $generatedRc = Join-Path $buildDir 'probe.rc'
            $generation = @($project.SelectNodes('//*[local-name()="GenerateManifest"]'))
            if ($generation.Count -ne 1 -or $generation[0].GetAttribute('Condition') -notmatch 'Release\|x64' -or $generation[0].InnerText -ne 'false') {
              throw 'Actual Release project does not exclusively disable generated manifest'
            }
            $resourceItems = @($project.SelectNodes('//*[local-name()="ResourceCompile" and @Include]'))
            if ($resourceItems.Count -ne 1 -or
                -not [string]::Equals([IO.Path]::GetFullPath($resourceItems[0].GetAttribute('Include'), $buildDir), $generatedRc, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Actual project resource input is not the sole generated probe.rc'
            }
            if (@($project.SelectNodes('//*[local-name()="AdditionalManifestFiles" or (local-name()="Manifest" and @Include)]')).Count) { throw 'Additional project manifest producer present' }
            $compile.manifestProjectPolicy = @{ GenerateManifest = $generation[0].InnerText; Condition = $generation[0].GetAttribute('Condition'); resource = $generatedRc }
            if ([string]::IsNullOrWhiteSpace($compile.WindowsSDK) -or $compile.PlatformToolset.Count -ne 1 -or
                $compile.PlatformToolset[0] -ne 'v143') { throw 'Actual VS2022 SDK/toolset not verified' }
            Copy-Item -LiteralPath $projectPath -Destination (Join-Path $evidenceDir 'nstu-native-uia-probe.vcxproj')
            Copy-Item -LiteralPath $compilerFiles[0].FullName -Destination (Join-Path $evidenceDir 'CMakeCXXCompiler.cmake')

            $compile.phase = 'build'
            & cmake --build $buildDir --config Release --parallel -- /v:normal /nologo *> (Join-Path $evidenceDir 'build.log')
            $compile.buildExit = $LASTEXITCODE
            if ($compile.buildExit -ne 0) { throw "Strict MSVC build failed: $($compile.buildExit)" }
            $compile.phase = 'binary'
            $exe = Get-Item -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe')
            $dumpbin = Join-Path $cl.DirectoryName 'dumpbin.exe'
            if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) { throw 'Verified MSVC dumpbin missing' }
            & $dumpbin /headers $exe.FullName *> (Join-Path $evidenceDir 'pe-headers.log')
            $headersExit = $LASTEXITCODE
            if ($headersExit -ne 0) { throw 'PE header inspection failed' }
            & $dumpbin /imports $exe.FullName *> (Join-Path $evidenceDir 'pe-imports.log')
            $importsExit = $LASTEXITCODE
            if ($importsExit -ne 0) { throw 'PE import inspection failed' }
            if ((Get-Content -LiteralPath (Join-Path $evidenceDir 'pe-headers.log') -Raw) -notmatch '8664 machine \(x64\)') { throw 'Executable is not PE x64' }
            $importText = Get-Content -LiteralPath (Join-Path $evidenceDir 'pe-imports.log') -Raw
            $imports = @([regex]::Matches($importText, '(?im)^\s*([a-z0-9_.-]+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
            if ($imports.Count -eq 0 -or $imports -notcontains 'UIAutomationCore.dll') { throw 'System UIA imports not verified' }
            foreach ($dll in $imports) {
              if ($dll -match '^(msvcp|vcruntime|ucrtbase|api-ms-win-crt)') { throw "Dynamic CRT import contradicts static CRT: $dll" }
              if ($dll -notmatch '^(api|ext)-ms-win-' -and -not (Test-Path -LiteralPath (Join-Path $env:SystemRoot "System32/$dll") -PathType Leaf)) {
                throw "Non-system direct import: $dll"
              }
            }
            $compile.imports = $imports
            $compile.phase = 'embedded-manifest'
            $manifestReceipt = [ordered]@{
              status = 'RUNNING'; phase = 'link-policy'; checkoutSha = $inputs.checkoutSha
              workflowSha256 = $inputs.workflowSha256; sourceHashes = $inputs.sourceHashes
              CMakeSha256 = $inputs.sourceHashes.'tools/native-uia-probe/CMakeLists.txt'
              projectPolicy = $compile.manifestProjectPolicy; binarySha256Before = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
              binarySha256After = $null; resources = @(); extractExit = $null; validateExit = $null
              mtHelpExit = $null; mt = $null; WindowsSDK = $compile.WindowsSDK; error = $null
            }
            try {
              $buildLines = @(Get-Content -LiteralPath (Join-Path $evidenceDir 'build.log'))
              $link = Read-ActualCommand $buildLines (Join-Path $cl.DirectoryName 'link.exe')
              $link.text | Set-Content -LiteralPath (Join-Path $evidenceDir 'actual-link-command.log') -Encoding utf8
              $linkArguments = Expand-LinkResponses $link.arguments
              $manifestSwitches = @($linkArguments | Where-Object { $_ -match '(?i)^/MANIFEST(?::|$)' })
              if ($manifestSwitches.Count -ne 1 -or $manifestSwitches[0] -ine '/MANIFEST:NO') { throw 'Actual link has a missing/conflicting automatic manifest policy' }
              $resourceArguments = @($linkArguments | Where-Object { [IO.Path]::GetExtension($_) -ieq '.res' })
              if ($resourceArguments.Count -ne 1 -or [IO.Path]::GetFileName($resourceArguments[0]) -ine 'probe.res') { throw 'Actual link does not use exactly one custom probe.res' }
              $linkedResource = [IO.Path]::GetFullPath($resourceArguments[0], $buildDir)
              if ($compile.WindowsSDK -notmatch '^10\.0\.\d+\.\d+$') { throw 'Actual Windows SDK version is not exact' }
              $kits = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots'
              if ([string]::IsNullOrWhiteSpace($kits.KitsRoot10) -or -not [IO.Path]::IsPathRooted($kits.KitsRoot10)) { throw 'Installed Windows Kits root missing' }
              $sdkBin = [IO.Path]::GetFullPath((Join-Path $kits.KitsRoot10 ('bin/' + $compile.WindowsSDK + '/x64')))
              $mt = Get-Item -LiteralPath (Join-Path $sdkBin 'mt.exe')
              $rc = Get-Item -LiteralPath (Join-Path $sdkBin 'rc.exe')
              if ($mt.Name -ine 'mt.exe' -or $rc.Name -ine 'rc.exe' -or $mt.PSIsContainer -or $rc.PSIsContainer -or $mt.Length -le 0 -or $rc.Length -le 0 -or
                  [string]::IsNullOrWhiteSpace($mt.VersionInfo.FileVersion) -or [string]::IsNullOrWhiteSpace($rc.VersionInfo.FileVersion) -or
                  -not [string]::Equals($mt.DirectoryName, $sdkBin, [StringComparison]::OrdinalIgnoreCase) -or
                  -not [string]::Equals($rc.DirectoryName, $sdkBin, [StringComparison]::OrdinalIgnoreCase)) { throw 'Installed SDK tool resolution differs' }
              $manifestReceipt.mt = @{ path = $mt.FullName; version = $mt.VersionInfo.FileVersion; sha256 = (Get-FileHash -LiteralPath $mt.FullName -Algorithm SHA256).Hash }
              $resourceCommand = Read-ActualCommand $buildLines $rc.FullName
              $resourceCommand.text | Set-Content -LiteralPath (Join-Path $evidenceDir 'actual-resource-compile-command.log') -Encoding utf8
              $rcArguments = $resourceCommand.arguments
              $languages = @($rcArguments | Where-Object { $_ -match '(?i)^/l(?:0x)?[0-9a-f]+$' })
              if ($languages.Count -ne 1) { throw 'Actual resource compiler language missing/ambiguous' }
              $resourceLanguage = [Convert]::ToUInt16(($languages[0] -replace '(?i)^/l(?:0x)?', ''), 16)
              $rcInputs = @($rcArguments | Where-Object { [IO.Path]::GetExtension($_) -ieq '.rc' })
              $rcOutputs = @($rcArguments | Where-Object { $_ -match '(?i)^/fo.+' })
              if ($rcInputs.Count -ne 1 -or $rcOutputs.Count -ne 1 -or
                  -not [string]::Equals([IO.Path]::GetFullPath($rcInputs[0], $buildDir), $generatedRc, [StringComparison]::OrdinalIgnoreCase) -or
                  -not [string]::Equals([IO.Path]::GetFullPath($rcOutputs[0].Substring(3), $buildDir), $linkedResource, [StringComparison]::OrdinalIgnoreCase)) { throw 'Actual resource compiler/link inputs disagree' }
              $manifestReceipt.linkPolicy = @{ manifestSwitches = $manifestSwitches; resource = $linkedResource
                commandSha256 = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'actual-link-command.log') -Algorithm SHA256).Hash; responseFiles = $responseFiles.ToArray() }
              $manifestReceipt.resourceCompiler = @{ path = $rc.FullName; version = $rc.VersionInfo.FileVersion
                sha256 = (Get-FileHash -LiteralPath $rc.FullName -Algorithm SHA256).Hash; language = $resourceLanguage
                commandSha256 = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'actual-resource-compile-command.log') -Algorithm SHA256).Hash }
              $manifestReceipt.generated = @{ manifestSha256 = (Get-FileHash -LiteralPath $generatedManifest -Algorithm SHA256).Hash
                rcSha256 = (Get-FileHash -LiteralPath $generatedRc -Algorithm SHA256).Hash; resSha256 = (Get-FileHash -LiteralPath $linkedResource -Algorithm SHA256).Hash }
              $manifestReceipt.phase = 'SDK-extraction'
              & $mt.FullName '-?' *> (Join-Path $evidenceDir 'mt-help.log')
              $manifestReceipt.mtHelpExit = $LASTEXITCODE
              $help = Get-Content -LiteralPath (Join-Path $evidenceDir 'mt-help.log') -Raw
              if ($manifestReceipt.mtHelpExit -ne 0 -or $help -notmatch '(?i)inputresource' -or $help -notmatch '(?i)validate_manifest') { throw 'Installed SDK manifest tool syntax unavailable' }
              $extractedPath = Join-Path $evidenceDir 'embedded-manifest.xml'
              & $mt.FullName "-inputresource:$($exe.FullName);#1" "-out:$extractedPath" *> (Join-Path $evidenceDir 'mt-extract.log')
              $manifestReceipt.extractExit = $LASTEXITCODE
              if ($manifestReceipt.extractExit -ne 0 -or -not (Test-Path -LiteralPath $extractedPath -PathType Leaf)) { throw 'Actual resource1 extraction failed' }
              & $mt.FullName '-manifest' $extractedPath '-validate_manifest' *> (Join-Path $evidenceDir 'mt-validate.log')
              $manifestReceipt.validateExit = $LASTEXITCODE
              if ($manifestReceipt.validateExit -ne 0) { throw 'Actual extracted manifest failed SDK validation' }
              $manifestReceipt.phase = 'resource-inventory'
              Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.Runtime.ExceptionServices;
          using System.Runtime.InteropServices;
          public static class NativeProbeManifestRead {
            public sealed class Entry { public bool Numeric; public ushort Id; public ushort Language; }
            [UnmanagedFunctionPointer(CallingConvention.Winapi)] [return: MarshalAs(UnmanagedType.Bool)]
            delegate bool Names(IntPtr module, IntPtr type, IntPtr name, IntPtr argument);
            [UnmanagedFunctionPointer(CallingConvention.Winapi)] [return: MarshalAs(UnmanagedType.Bool)]
            delegate bool Languages(IntPtr module, IntPtr type, IntPtr name, ushort language, IntPtr argument);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, ExactSpelling=true, SetLastError=true)]
            static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
            [DllImport("kernel32.dll", ExactSpelling=true, SetLastError=true)] [return: MarshalAs(UnmanagedType.Bool)]
            static extern bool FreeLibrary(IntPtr module);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, ExactSpelling=true, SetLastError=true)] [return: MarshalAs(UnmanagedType.Bool)]
            static extern bool EnumResourceNamesW(IntPtr module, IntPtr type, Names callback, IntPtr argument);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, ExactSpelling=true, SetLastError=true)] [return: MarshalAs(UnmanagedType.Bool)]
            static extern bool EnumResourceLanguagesW(IntPtr module, IntPtr type, IntPtr name, Languages callback, IntPtr argument);
            public static Entry[] Read(string path) {
              var entries=new List<Entry>();
              IntPtr module=LoadLibraryExW(path,IntPtr.Zero,0x02|0x20);
              if(module==IntPtr.Zero) throw new Win32Exception(Marshal.GetLastWin32Error(),"Read-only PE resource mapping failed");
              Exception primary=null,callbackException=null,releaseException=null;
              int callbackError=0,closeError=0; bool closed=false;
              try {
                Names names=delegate(IntPtr m,IntPtr type,IntPtr name,IntPtr argument) {
                  try {
                    bool numeric=((ulong)name.ToInt64()>>16)==0;
                    Languages languages=delegate(IntPtr lm,IntPtr lt,IntPtr ln,ushort language,IntPtr la) {
                      try {
                        entries.Add(new Entry { Numeric=numeric,Id=numeric?(ushort)name.ToInt64():(ushort)0,Language=language });
                        return true;
                      } catch(Exception error) {
                        if(callbackException==null) callbackException=error;
                        return false;
                      }
                    };
                    bool ok=EnumResourceLanguagesW(m,type,name,languages,IntPtr.Zero);
                    int languageError=ok?0:Marshal.GetLastWin32Error();
                    GC.KeepAlive(languages);
                    if(!ok && callbackError==0) callbackError=languageError;
                    return ok;
                  } catch(Exception error) {
                    if(callbackException==null) callbackException=error;
                    return false;
                  }
                };
                bool enumerated=EnumResourceNamesW(module,new IntPtr(24),names,IntPtr.Zero);
                int enumerationError=enumerated?0:Marshal.GetLastWin32Error();
                GC.KeepAlive(names);
                if(callbackException!=null) ExceptionDispatchInfo.Capture(callbackException).Throw();
                if(!enumerated) throw new Win32Exception(callbackError!=0?callbackError:enumerationError,"RT_MANIFEST enumeration failed");
              } catch(Exception error) { primary=error; }
              finally {
                try { closed=FreeLibrary(module); if(!closed) closeError=Marshal.GetLastWin32Error(); }
                catch(Exception error) { releaseException=error; }
              }
              if(!closed && releaseException==null) releaseException=new Win32Exception(closeError,"Resource mapping release failed");
              if(primary!=null && releaseException!=null) throw new AggregateException(primary,releaseException);
              if(primary!=null) ExceptionDispatchInfo.Capture(primary).Throw();
              if(releaseException!=null) ExceptionDispatchInfo.Capture(releaseException).Throw();
              return entries.ToArray();
            }
          }
          '@
              $resources = @([NativeProbeManifestRead]::Read($exe.FullName))
              $manifestReceipt.resources = @($resources | ForEach-Object { @{ numeric = $_.Numeric; id = $_.Id; language = $_.Language; type = 24 } })
              if ($resources.Count -ne 1 -or -not $resources[0].Numeric -or $resources[0].Id -ne 1 -or $resources[0].Language -ne $resourceLanguage) { throw 'Actual PE does not contain exactly resource24/1 at the compiled language' }
              $manifestReceipt.phase = 'privilege-DPI-XML'
              function Test-ManifestContract([string]$path) {
                $settings = [Xml.XmlReaderSettings]::new(); $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit; $settings.XmlResolver = $null
                $reader = [Xml.XmlReader]::Create($path, $settings)
                $document = [Xml.XmlDocument]::new(); $document.XmlResolver = $null
                $primary = $null; $cleanup = $null
                try { $document.Load($reader) } catch { $primary = $_.Exception }
                finally { try { $reader.Dispose() } catch { $cleanup = $_.Exception } }
                if ($primary -and $cleanup) { throw [AggregateException]::new($primary, $cleanup) }
                if ($primary) { [Runtime.ExceptionServices.ExceptionDispatchInfo]::Capture($primary).Throw() }
                if ($cleanup) { throw $cleanup }
                $names = [Xml.XmlNamespaceManager]::new($document.NameTable)
                $names.AddNamespace('a1','urn:schemas-microsoft-com:asm.v1'); $names.AddNamespace('a3','urn:schemas-microsoft-com:asm.v3')
                $names.AddNamespace('w05','http://schemas.microsoft.com/SMI/2005/WindowsSettings'); $names.AddNamespace('w16','http://schemas.microsoft.com/SMI/2016/WindowsSettings')
                $root = $document.DocumentElement
                $levels = $document.SelectNodes('/a1:assembly/a3:trustInfo/a3:security/a3:requestedPrivileges/a3:requestedExecutionLevel',$names)
                $dpi = $document.SelectNodes('/a1:assembly/a3:application/a3:windowsSettings/w16:dpiAwareness',$names)
                $fallback = $document.SelectNodes('/a1:assembly/a3:application/a3:windowsSettings/w05:dpiAware',$names)
                if ($root.LocalName -ne 'assembly' -or $root.NamespaceURI -ne 'urn:schemas-microsoft-com:asm.v1' -or $root.GetAttribute('manifestVersion') -ne '1.0' -or
                    $levels.Count -ne 1 -or $document.SelectNodes('//*[local-name()="requestedExecutionLevel"]').Count -ne 1 -or
                    $levels[0].GetAttribute('level') -ne 'asInvoker' -or $levels[0].GetAttribute('uiAccess') -ne 'false' -or
                    $dpi.Count -ne 1 -or $document.SelectNodes('//*[local-name()="dpiAwareness"]').Count -ne 1 -or $dpi[0].InnerText.Trim() -ne 'PerMonitorV2' -or
                    $fallback.Count -ne 1 -or $document.SelectNodes('//*[local-name()="dpiAware"]').Count -ne 1 -or $fallback[0].InnerText.Trim() -ne 'true/pm') { throw 'Actual XML execution privilege/DPI authority differs' }
              }
              Test-ManifestContract $generatedManifest
              Test-ManifestContract $extractedPath
              $manifestReceipt.xmlSha256 = (Get-FileHash -LiteralPath $extractedPath -Algorithm SHA256).Hash
              $manifestReceipt.binarySha256After = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
              if ($manifestReceipt.binarySha256After -ne $manifestReceipt.binarySha256Before) { throw 'Read-only manifest inspection changed executable' }
              $manifestReceipt.mtLogs = @{ help = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'mt-help.log') -Algorithm SHA256).Hash
                extract = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'mt-extract.log') -Algorithm SHA256).Hash
                validate = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'mt-validate.log') -Algorithm SHA256).Hash }
              $manifestReceipt.status = 'PASS'; $manifestReceipt.phase = 'complete'
            } catch { $manifestReceipt.status = 'FAIL'; $manifestReceipt.error = $_.Exception.ToString(); throw }
            finally {
              if ($null -eq $manifestReceipt.binarySha256After) {
                try { $manifestReceipt.binarySha256After = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash }
                catch { $manifestReceipt.binaryHashError = $_.Exception.ToString() }
              }
              $manifestReceipt.completedUtc = [DateTime]::UtcNow.ToString('o')
              $manifestReceipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $evidenceDir 'embedded-manifest-verification.json') -Encoding utf8
              $compile.embeddedManifestVerification = @{ status = $manifestReceipt.status; binarySha256 = $manifestReceipt.binarySha256Before
                xmlSha256 = $manifestReceipt.xmlSha256; receiptSha256 = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest-verification.json') -Algorithm SHA256).Hash }
            }
            $compile.binary = @{ sha256 = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash; size = $exe.Length }
            if ($compile.embeddedManifestVerification.status -ne 'PASS' -or $compile.binary.sha256 -ne $compile.embeddedManifestVerification.binarySha256 -or
                (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest-verification.json') -Algorithm SHA256).Hash -ne $compile.embeddedManifestVerification.receiptSha256 -or
                (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash -ne $compile.embeddedManifestVerification.xmlSha256) { throw 'Manifest verification drift before packaging the executable' }
            $packageDir = Join-Path $evidenceDir 'msvc-probe'
            New-Item -ItemType Directory -Path (Join-Path $packageDir 'source') | Out-Null
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $packageDir 'nstu-native-uia-probe.exe')
            foreach ($entry in $inputs.sourceHashes.PSObject.Properties) {
              $copy = Join-Path $packageDir ('source/' + [IO.Path]::GetFileName($entry.Name))
              Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $entry.Name) -Destination $copy
              if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash -ne $entry.Value) { throw 'Packaged source drift' }
            }
            if ((Get-FileHash -LiteralPath (Join-Path $packageDir 'nstu-native-uia-probe.exe') -Algorithm SHA256).Hash -ne $compile.binary.sha256) { throw 'Packaged executable drift' }
            foreach ($name in @('embedded-manifest.xml','embedded-manifest-verification.json')) {
              Copy-Item -LiteralPath (Join-Path $evidenceDir $name) -Destination (Join-Path $packageDir $name)
              if ((Get-FileHash -LiteralPath (Join-Path $packageDir $name) -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath (Join-Path $evidenceDir $name) -Algorithm SHA256).Hash) { throw 'Packaged manifest evidence differs' }
            }
            $compile.status = 'PASS'
            $compile.phase = 'complete'
          } catch {
            $compile.status = 'FAIL'
            $compile.error = $_.Exception.Message
            throw
          } finally {
            $buildLog = Join-Path $evidenceDir 'build.log'
            if (Test-Path -LiteralPath $buildLog) {
              $buildText = Get-Content -LiteralPath $buildLog -Raw
              $compile.warningDiagnostics = @($buildText -split '\r?\n' | Where-Object { $_ -match '\bwarning\s+[A-Z]+\d+\s*:' })
              $compile.warningDiagnosticLineCount = $compile.warningDiagnostics.Count
              $compile.D9025LineCount = @($compile.warningDiagnostics | Where-Object { $_ -match '\bD9025\b' }).Count
              $compile.zeroWarningDiagnosticLinesObserved = $compile.warningDiagnosticLineCount -eq 0
              $compile.buildLogSha256 = (Get-FileHash -LiteralPath $buildLog -Algorithm SHA256).Hash
            }
            $compile.completedUtc = [DateTime]::UtcNow.ToString('o')
            $compile | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDir 'compile.json') -Encoding utf8
            if ($compile.status -eq 'PASS') {
              $manifest = [ordered]@{ checkoutSha = $inputs.checkoutSha; workflowSha256 = $inputs.workflowSha256
                runId = $inputs.runId; attempt = $inputs.attempt; sourceHashes = $inputs.sourceHashes
                executable = 'msvc-probe/nstu-native-uia-probe.exe'; binary = $compile.binary
                MSVC_COMPILE = 'PASS'; compiler = $compile.compiler; settings = $compile.settings
                translationUnits = $compile.translationUnits; activeAssertionsProof = $compile.activeAssertionsProof
                WindowsSDK = $compile.WindowsSDK; PlatformToolset = $compile.PlatformToolset
                embeddedManifestVerification = $compile.embeddedManifestVerification; embeddedManifest = 'msvc-probe/embedded-manifest.xml'; embeddedManifestReceipt = 'msvc-probe/embedded-manifest-verification.json'
                OS = $compile.OS; UIAutomationCore = $compile.UIAutomationCore; imports = $compile.imports
                warningDiagnosticLineCount = $compile.warningDiagnosticLineCount; warningDiagnostics = $compile.warningDiagnostics
                D9025LineCount = $compile.D9025LineCount; compileReceiptSha256 = (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'compile.json') -Algorithm SHA256).Hash
                ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'; ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED' }
              $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDir 'msvc-probe/manifest.json') -Encoding utf8
            }
          }

      - name: Require observed own CI desktop context
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $context = [ordered]@{ status = 'RUNNING'; CI_OWN_WINDOW = 'NOT_RUN'; userInteractive = [Environment]::UserInteractive
            sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId; desktopOpened = $false; desktopError = $null
            desktopClosed = $false; OS = [Environment]::OSVersion.VersionString }
          try {
            Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeProbeCiDesktop {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
            [DllImport("user32.dll", SetLastError=true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool CloseDesktop(IntPtr desktop);
          }
          '@
            $desktop = [NativeProbeCiDesktop]::OpenInputDesktop(0, $false, 1)
            $context.desktopOpened = $desktop -ne [IntPtr]::Zero
            $context.desktopError = if ($context.desktopOpened) { 0 } else { [Runtime.InteropServices.Marshal]::GetLastWin32Error() }
            if ($context.desktopOpened) { $context.desktopClosed = [NativeProbeCiDesktop]::CloseDesktop($desktop) }
            if (-not $context.userInteractive -or $context.sessionId -le 0 -or -not $context.desktopOpened -or -not $context.desktopClosed) {
              throw 'CI own-window context unavailable; runtime unqualified'
            }
            $context.status = 'ELIGIBLE_NOT_QUALIFIED'
          } catch {
            $context.status = 'FAIL'
            $context.CI_OWN_WINDOW = 'NOT_RUN_CONTEXT_REJECTED'
            $context.error = $_.Exception.Message
            throw
          } finally {
            $context | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidenceDir 'context.json') -Encoding utf8
          }

      - name: Verify all ten exact CTest registrations
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $inputs = Get-Content -LiteralPath (Join-Path $evidenceDir 'inputs.json') -Raw | ConvertFrom-Json
          $receipt = [ordered]@{ status = 'RUNNING'; inventoryExit = $null; count = $null }
          try {
            & ctest --test-dir $buildDir -C Release --show-only=json-v1 > (Join-Path $evidenceDir 'test-inventory.json')
            $receipt.inventoryExit = $LASTEXITCODE
            if ($receipt.inventoryExit -ne 0) { throw 'CTest inventory failed' }
            $inventory = Get-Content -LiteralPath (Join-Path $evidenceDir 'test-inventory.json') -Raw | ConvertFrom-Json
            $receipt.count = @($inventory.tests).Count
            if ($receipt.count -ne 10 -or @($inventory.tests.name | Sort-Object -Unique).Count -ne 10) { throw 'CTest cohort missing or duplicated' }
            $exe = (Resolve-Path -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe')).Path
            $manifestPath = Join-Path $evidenceDir 'embedded-manifest-verification.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
            if ($manifest.status -ne 'PASS' -or $manifest.checkoutSha -ne $inputs.checkoutSha -or $manifest.workflowSha256 -ne $inputs.workflowSha256 -or
                $manifest.binarySha256Before -ne (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -or $manifest.binarySha256After -ne $manifest.binarySha256Before -or
                $manifest.xmlSha256 -ne (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash) { throw 'Manifest qualification is not bound to the exact inventory executable' }
            $receipt.embeddedManifestVerificationSha256 = $manifestHash
            foreach ($expected in $inputs.expectedTests) {
              $matchingTests = @($inventory.tests | Where-Object { $_.name -eq $expected.name })
              if ($matchingTests.Count -ne 1) { throw "Missing exact test: $($expected.name)" }
              $test = $matchingTests[0]
              if (@($test.command).Count -ne 2 -or $test.command[1] -ne $expected.mode -or
                  -not [string]::Equals([IO.Path]::GetFullPath($test.command[0]), $exe, [StringComparison]::OrdinalIgnoreCase)) { throw 'CTest command differs from exact built probe/mode' }
              $timeouts = @($test.properties | Where-Object { $_.name -eq 'TIMEOUT' })
              if ($timeouts.Count -ne 1 -or [double]$timeouts[0].value -ne $expected.timeout) { throw 'CTest timeout changed' }
              if (@($test.properties | Where-Object { $_.name -eq 'SKIP_RETURN_CODE' -or
                    ($_.name -in @('DISABLED', 'WILL_FAIL') -and $_.value) }).Count) { throw 'CTest skip or nonzero override present' }
            }
            $receipt.status = 'PASS'
          } catch {
            $receipt.status = 'FAIL'; $receipt.error = $_.Exception.Message; throw
          } finally {
            $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidenceDir 'inventory-check.json') -Encoding utf8
          }

      - name: Execute ten native cases once and validate complete evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          $inputs = Get-Content -LiteralPath (Join-Path $evidenceDir 'inputs.json') -Raw | ConvertFrom-Json
          $compile = Get-Content -LiteralPath (Join-Path $evidenceDir 'compile.json') -Raw | ConvertFrom-Json
          $result = [ordered]@{ status = 'RUNNING'; CI_OWN_WINDOW = 'RUNNING'; testExit = $null; results = @()
            ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'; ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED' }
          try {
            $manifestPath = Join-Path $evidenceDir 'embedded-manifest-verification.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
            if ($manifest.status -ne 'PASS' -or $manifest.checkoutSha -ne $inputs.checkoutSha -or $manifest.workflowSha256 -ne $inputs.workflowSha256 -or
                $manifest.binarySha256Before -ne $compile.binary.sha256 -or $manifest.binarySha256After -ne $compile.binary.sha256 -or
                $manifestHash -ne $compile.embeddedManifestVerification.receiptSha256 -or
                $manifest.xmlSha256 -ne (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash -or
                (Get-FileHash -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe') -Algorithm SHA256).Hash -ne $compile.binary.sha256) { throw 'Manifest verification prerequisite failed before native execution' }
            $result.embeddedManifestVerificationSha256 = $manifestHash
            & ctest --test-dir $buildDir -C Release --parallel 1 --stop-on-failure --no-tests=error --verbose `
              --output-log (Join-Path $evidenceDir 'ctest.log') --output-junit (Join-Path $evidenceDir 'ctest-junit.xml')
            $result.testExit = $LASTEXITCODE
            if ($result.testExit -ne 0) { throw "Real Native UIA CTest failure: $($result.testExit)" }
            [xml]$junit = Get-Content -LiteralPath (Join-Path $evidenceDir 'ctest-junit.xml') -Raw
            $cases = @($junit.SelectNodes('//*[local-name()="testcase"]'))
            if ($cases.Count -ne 10 -or @($cases | ForEach-Object { $_.GetAttribute('name') } | Sort-Object -Unique).Count -ne 10 -or
                $junit.SelectNodes('//*[local-name()="skipped" or local-name()="failure" or local-name()="error"]').Count) { throw 'JUnit does not prove ten executed successful cases' }
            if (-not (Test-Path -LiteralPath (Join-Path $buildDir 'Testing/Temporary/LastTest.log') -PathType Leaf)) { throw 'Complete CTest temporary output missing' }
            $outputs = @{}
            foreach ($expected in $inputs.expectedTests) {
              $case = @($cases | Where-Object { $_.GetAttribute('name') -eq $expected.name })
              if ($case.Count -ne 1 -or -not $case[0].HasAttribute('time')) { throw 'Missing named result/duration' }
              $outputNode = $case[0].SelectSingleNode('*[local-name()="system-out"]')
              if (-not $outputNode -or -not $outputNode.InnerText.Trim()) { throw 'Native case output missing' }
              $outputs[$expected.name] = $outputNode.InnerText
              $result.results += @{ name = $expected.name; status = 'PASS'; seconds = [double]::Parse($case[0].GetAttribute('time'), [Globalization.CultureInfo]::InvariantCulture) }
            }

            # Adjudicate only the native focus evidence actually printed by the frozen source.
            function Read-NativeFocusEpoch([string]$text) {
              $lines = $text -split '\r?\n'
              $headers = @($lines | Where-Object { $_ -match '^DIAGNOSTIC epoch=' })
              if ($headers.Count -ne 1) { throw 'Missing or ambiguous final diagnostic epoch' }
              $fields = @{}
              foreach ($match in [regex]::Matches($headers[0], '(\w+)=(\d+)')) { $fields[$match.Groups[1].Value] = [long]$match.Groups[2].Value }
              foreach ($key in @('epoch', 'generation', 'target', 'complete', 'valid', 'armed', 'disarm_confirmed', 'removal', 'pop_seq', 'post_pump', 'target_mutated')) {
                if (-not $fields.ContainsKey($key)) { throw 'Incomplete final diagnostic fields' }
              }
              if ($fields.epoch -le 0 -or $fields.generation -le 0 -or $fields.target -le 0 -or $fields.complete -ne 1 -or
                  $fields.valid -ne 1 -or $fields.armed -ne 0 -or $fields.disarm_confirmed -ne 1 -or
                  $fields.removal -ne 1 -or $fields.target_mutated -ne 0) { throw 'Final identity/completeness/disarm/cancellation evidence invalid' }
              $csvHeaders = @($lines | Where-Object { $_ -match '^seq,pump,token,actor,candidateOS,' })
              if ($csvHeaders.Count -ne 1) { throw 'Full focus CSV header missing' }
              $csvLines = @($lines | Where-Object { $_ -match '^\d+,\d+,\d+,' })
              $rows = @(($csvHeaders[0] + "`n" + ($csvLines -join "`n")) | ConvertFrom-Csv)
              if ($rows.Count -eq 0 -or $rows.Count -gt 256) { throw 'Focus trace absent or oversized' }
              $sequence = 0L
              foreach ($row in $rows) { ++$sequence; if ([long]$row.seq -ne $sequence) { throw 'Lost or noncontiguous focus records' } }
              $targetRows = @($rows | Where-Object { [long]$_.token -eq $fields.target })
              $cancel = @($targetRows | Where-Object { [int]$_.phase -eq 5 -and [int]$_.completion -eq 2 -and [long]$_.hr -eq -2146233083 })
              $pop = @($targetRows | Where-Object { [int]$_.phase -eq 7 -and [long]$_.seq -eq $fields.pop_seq })
              if ($cancel.Count -ne 1 -or $pop.Count -ne 1 -or [long]$cancel[0].seq -ge [long]$pop[0].seq -or
                  @($targetRows | Where-Object { [int]$_.phase -eq 6 }).Count -or
                  @($targetRows | Where-Object { [int]$_.phase -eq 2 -and [long]$_.actor -eq 1 }).Count -ne 1) { throw 'Exact target admission/cancellation/pop/nonmutation missing' }
              $cover = @($rows | Where-Object { [int]$_.phase -eq 11 -and [long]$_.seq -eq $fields.post_pump -and
                [long]$_.pump -eq [long]$pop[0].pump -and [long]$_.seq -gt [long]$pop[0].seq -and
                [long]$_.firstPop -le [long]$pop[0].seq -and [long]$_.lastPop -ge [long]$pop[0].seq })
              if ($cover.Count -ne 1 -or @($rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 13 }).Count -ne 1) { throw 'Covering final pump/epoch-end missing' }
              return @{ fields = $fields; rows = $rows; cancellationSequence = [long]$cancel[0].seq }
            }
            $focus = @{}
            foreach ($name in @('native_uia_own_window', 'native_uia_focus_isolated', 'native_uia_focus_direct_interleave', 'native_uia_focus_os_interleave')) {
              $focus[$name] = Read-NativeFocusEpoch $outputs[$name]
            }
            $isolated = $focus.native_uia_focus_isolated
            $baseline = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 5 })
            $latch = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 6 })
            $assertion = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 12 })
            $end = @($isolated.rows | Where-Object { [int]$_.phase -eq 0 -and [int]$_.stage -eq 13 })
            if ($baseline.Count -ne 1 -or $latch.Count -ne 1 -or $assertion.Count -ne 1 -or $end.Count -ne 1 -or
                [int]$baseline[0].host -ne 1 -or [int]$baseline[0].after -ne 1 -or [int]$baseline[0].total -ne 0 -or
                [int]$latch[0].host -ne 1 -or [int]$latch[0].after -ne 1 -or [int]$latch[0].total -ne 0 -or
                [int]$end[0].host -ne 1 -or [int]$end[0].after -ne 1 -or $isolated.fields.other_valid -ne 0 -or
                $isolated.fields.unplanned -ne 0 -or [long]$assertion[0].seq -le [long]$latch[0].seq -or
                @($isolated.rows | Where-Object { [long]$_.seq -gt [long]$latch[0].seq -and [long]$_.seq -le [long]$assertion[0].seq -and
                  [int]$_.phase -eq 12 -and [int]$_.host -eq 0 }).Count) { throw 'Isolated focused baseline/latch/final or contamination evidence failed' }
            $direct = $focus.native_uia_focus_direct_interleave
            $competitors = @($direct.rows | Where-Object { [long]$_.token -ne $direct.fields.target -and [long]$_.actor -eq 2 -and
              [int]$_.origin -eq 3 -and [int]$_.action -eq 2 -and [int]$_.phase -eq 6 -and [int]$_.held -eq 1 -and
              [int]$_.expired -eq 0 -and [long]$_.hr -eq 0 -and [int]$_.before -eq 1 -and [int]$_.after -eq 2 -and
              [long]$_.seq -lt $direct.cancellationSequence })
            if ($direct.fields.other_valid -ne 1 -or $competitors.Count -ne 1) { throw 'Direct valid competing mutation not evidenced' }
            $competitorCompletion = @($direct.rows | Where-Object { [long]$_.token -eq [long]$competitors[0].token -and
              [long]$_.actor -eq 2 -and [int]$_.phase -eq 4 -and [int]$_.completion -eq 1 -and [long]$_.hr -eq 0 -and
              [int]$_.held -eq 1 -and [int]$_.expired -eq 0 -and [long]$_.seq -gt [long]$competitors[0].seq -and
              [long]$_.seq -lt $direct.cancellationSequence })
            if ($competitorCompletion.Count -ne 1) { throw 'Direct competitor actual completion missing' }

            $os = $focus.native_uia_focus_os_interleave
            $osLabel = [regex]::Match($outputs.native_uia_focus_os_interleave, 'CONTROLLED OS Value result=(-?\d+) Value_evidence=(consistent-success|consistent-timeout)')
            if (-not $osLabel.Success) { throw 'OS Value result inconclusive or missing' }
            $actual = [long]$osLabel.Groups[1].Value
            $begin = @($os.rows | Where-Object { [int]$_.phase -eq 0 -and [long]$_.actor -eq 3 -and [int]$_.origin -eq 1 -and [int]$_.stage -eq 1 })
            $returned = @($os.rows | Where-Object { [int]$_.phase -eq 0 -and [long]$_.actor -eq 3 -and [int]$_.origin -eq 1 -and [int]$_.stage -eq 2 })
            if ($begin.Count -ne 1 -or $returned.Count -ne 1 -or [long]$returned[0].hr -ne $actual -or
                [long]$begin[0].seq -ge [long]$returned[0].seq) { throw 'Actual OS call interval/HRESULT missing' }
            $submitted = @($os.rows | Where-Object { [int]$_.phase -eq 1 -and [int]$_.action -eq 1 -and [int]$_.node -eq 2 -and
              [long]$_.candidateOS -eq 3 -and [long]$_.seq -gt [long]$begin[0].seq -and [long]$_.seq -lt [long]$returned[0].seq })
            if ($submitted.Count -ne 1) { throw 'OS actual Value token missing or ambiguous' }
            $valueRows = @($os.rows | Where-Object { [long]$_.token -eq [long]$submitted[0].token })
            if (@($valueRows | Where-Object { [int]$_.action -ne 1 -or [int]$_.node -ne 2 -or [long]$_.candidateOS -ne 3 -or
                ([int]$_.phase -ge 1 -and [int]$_.phase -le 6 -and
                  ([long]$_.seq -le [long]$begin[0].seq -or [long]$_.seq -ge [long]$returned[0].seq)) -or
                [int]$_.phase -eq 3 }).Count) { throw 'Value token context/path inconsistent' }
            $queued = @($valueRows | Where-Object { [int]$_.phase -eq 2 })
            $completed = @($valueRows | Where-Object { [int]$_.phase -eq 4 -and [int]$_.completion -eq 1 -and [long]$_.hr -eq 0 -and [int]$_.expired -eq 0 })
            $mutated = @($valueRows | Where-Object { [int]$_.phase -eq 6 -and [long]$_.hr -eq 0 -and [int]$_.expired -eq 0 })
            $canceled = @($valueRows | Where-Object { [int]$_.phase -eq 5 -and [int]$_.completion -eq 2 -and [long]$_.hr -eq -2146233083 })
            if ($actual -eq 0 -and $osLabel.Groups[2].Value -eq 'consistent-success') {
              if ($completed.Count -ne 1 -or $mutated.Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 5 }).Count -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 4 }).Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 6 }).Count -ne 1 -or $queued.Count -gt 1 -or
                  [long]$submitted[0].seq -ge [long]$mutated[0].seq -or [long]$mutated[0].seq -ge [long]$completed[0].seq -or
                  [long]$completed[0].seq -ge [long]$returned[0].seq) { throw 'Actual successful Value history inconsistent' }
              if ($queued.Count -eq 1 -and ([long]$queued[0].seq -le [long]$submitted[0].seq -or [long]$queued[0].seq -ge [long]$mutated[0].seq)) { throw 'Value queued admission inconsistent' }
              if ($queued.Count -eq 0 -and ([long]$submitted[0].caller -ne [long]$submitted[0].executing -or
                  [long]$completed[0].executing -ne [long]$submitted[0].executing)) { throw 'Value direct execution not evidenced' }
            } elseif ($actual -eq -2146233083 -and $osLabel.Groups[2].Value -eq 'consistent-timeout') {
              if ($queued.Count -ne 1 -or $canceled.Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -eq 5 }).Count -ne 1 -or
                  @($valueRows | Where-Object { [int]$_.phase -in @(4, 6) }).Count -or
                  [long]$submitted[0].seq -ge [long]$queued[0].seq -or [long]$queued[0].seq -ge [long]$canceled[0].seq -or
                  [long]$canceled[0].seq -ge [long]$returned[0].seq) { throw 'Actual queued Value timeout history inconsistent' }
            } else { throw 'Actual OS Value result and oracle disagree' }
            $result.focusEvidence = @{ isolated = $isolated.fields; direct = $direct.fields; OS = $os.fields
              osValueResult = $actual; osValueOracle = $osLabel.Groups[2].Value; osAssociation = 'candidate interval consistent' }
            foreach ($entry in $inputs.sourceHashes.PSObject.Properties) {
              if ((Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $entry.Name) -Algorithm SHA256).Hash -ne $entry.Value) { throw 'Source changed during runtime' }
            }
            if ((Get-FileHash -LiteralPath (Join-Path $buildDir 'Release/nstu-native-uia-probe.exe') -Algorithm SHA256).Hash -ne $compile.binary.sha256) { throw 'Executable changed during runtime' }
            if ((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash -ne $manifestHash -or (Get-FileHash -LiteralPath (Join-Path $evidenceDir 'embedded-manifest.xml') -Algorithm SHA256).Hash -ne $manifest.xmlSha256) { throw 'Manifest evidence changed during runtime' }
            $result.status = 'PASS'; $result.CI_OWN_WINDOW = 'PASS'
          } catch {
            $result.status = 'FAIL'; $result.CI_OWN_WINDOW = 'FAIL'; $result.error = $_.Exception.Message; throw
          } finally {
            $result.completedUtc = [DateTime]::UtcNow.ToString('o')
            $result | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceDir 'test-result.json') -Encoding utf8
          }

      - name: Preserve phase results and complete logs
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-evidence'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $temporary = Join-Path $env:GITHUB_WORKSPACE 'build/native-uia-msvc-release/Testing/Temporary'
          if (Test-Path -LiteralPath $temporary -PathType Container) {
            Copy-Item -LiteralPath $temporary -Destination (Join-Path $evidenceDir 'ctest-temporary') -Recurse
          }
          $final = [ordered]@{ MSVC_COMPILE = 'NOT_RUN'; CI_OWN_WINDOW = 'NOT_RUN'
            ROOT_MSVC_DIAGNOSTIC = 'PENDING_SEPARATE_ROOT_ADMISSION'; ACTUAL_NSTU_PHYSICAL = 'NOT_TESTED'
            checkoutSha = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            evidence = @(); warningDiagnosticLineCount = $null; D9025LineCount = $null }
          $compilePath = Join-Path $evidenceDir 'compile.json'
          if (Test-Path -LiteralPath $compilePath) {
            $compile = Get-Content -LiteralPath $compilePath -Raw | ConvertFrom-Json
            $final.MSVC_COMPILE = $compile.status
            $final.warningDiagnosticLineCount = $compile.warningDiagnosticLineCount
            $final.D9025LineCount = $compile.D9025LineCount
          }
          $contextPath = Join-Path $evidenceDir 'context.json'
          if (Test-Path -LiteralPath $contextPath) { $final.CI_OWN_WINDOW = (Get-Content -LiteralPath $contextPath -Raw | ConvertFrom-Json).CI_OWN_WINDOW }
          $testPath = Join-Path $evidenceDir 'test-result.json'
          if (Test-Path -LiteralPath $testPath) { $final.CI_OWN_WINDOW = (Get-Content -LiteralPath $testPath -Raw | ConvertFrom-Json).CI_OWN_WINDOW }
          $manifestPath = Join-Path $evidenceDir 'embedded-manifest-verification.json'
          $final.EMBEDDED_MANIFEST = 'NOT_RUN'
          if (Test-Path -LiteralPath $manifestPath) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $final.EMBEDDED_MANIFEST = $manifest.status
            $final.embeddedManifestVerificationSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
            $final.embeddedManifestXmlSha256 = $manifest.xmlSha256
            $final.embeddedManifestBinarySha256 = $manifest.binarySha256Before
          }
          foreach ($file in Get-ChildItem -LiteralPath $evidenceDir -Recurse -File) {
            $final.evidence += @{ path = [IO.Path]::GetRelativePath($evidenceDir, $file.FullName); sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash; size = $file.Length }
          }
          $final | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDir 'final-status.json') -Encoding utf8
          if ($final.MSVC_COMPILE -eq 'PASS' -and $final.CI_OWN_WINDOW -eq 'PASS') {
            "Standalone Native UIA MSVC Release compile qualified; ten CI own-window cases passed at this recorded runner context. Compiler diagnostic lines: $($final.warningDiagnosticLineCount), including D9025: $($final.D9025LineCount). Root-owned MSVC diagnostic adjudication pending the exact artifact. Actual NSTU / AT / TextPattern / IME / DPI / physical NOT TESTED." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Standalone Native UIA evidence: MSVC_COMPILE=$($final.MSVC_COMPILE), CI_OWN_WINDOW=$($final.CI_OWN_WINDOW). Compiler diagnostic lines: $($final.warningDiagnosticLineCount), including D9025: $($final.D9025LineCount). Failed/unexecuted phases remain unqualified. Actual NSTU / AT / physical NOT TESTED." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload qualification evidence and exact MSVC probe package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-uia-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-uia-msvc-evidence/
          if-no-files-found: error
          retention-days: 14
