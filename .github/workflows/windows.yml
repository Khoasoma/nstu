name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Configure
        run: cmake -S . -B build -A x64 -DNSTU_ENABLE_WERROR=ON -DNSTU_INTERNAL_TEST_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: MSVC Release assertion proof in spaced paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          if ($env:CL -or $env:_CL_) { throw 'Unexpected MSVC option environment.' }
          $proofRoot = Join-Path $env:GITHUB_WORKSPACE 'build/assertion proof project'
          if (Test-Path -LiteralPath $proofRoot) { throw 'Assertion proof path already exists; preserve it.' }
          $sourceRoot = Join-Path $proofRoot 'source with spaces'
          $buildRoot = Join-Path $proofRoot 'build with spaces'
          $logRoot = Join-Path $proofRoot 'raw logs'
          New-Item -ItemType Directory -Path $sourceRoot, $logRoot -ErrorAction Stop | Out-Null
          $cmake = (Get-Command cmake -ErrorAction Stop).Source
          function Invoke-AssertionProofNative {
            param([string]$Name, [string]$Program, [string[]]$ArgumentList, [int]$ExpectedExit, [switch]$CheckWarnings)
            $stdout = Join-Path $logRoot ($Name + '.stdout')
            $stderr = Join-Path $logRoot ($Name + '.stderr')
            & $Program @ArgumentList 1> $stdout 2> $stderr
            $nativeExit = $LASTEXITCODE
            $receipt = @{ program = $Program; argv = $ArgumentList; actualExit = $nativeExit; expectedExit = $ExpectedExit }
            [IO.File]::WriteAllText((Join-Path $logRoot ($Name + '.json')), ($receipt | ConvertTo-Json -Depth 4), $utf8NoBom)
            $raw = [IO.File]::ReadAllText($stdout) + "`n" + [IO.File]::ReadAllText($stderr)
            if ($CheckWarnings -and $raw -match '(?im)^(?!\s*0\s+Warning\(s\)\s*$).*\bwarning\b|\bD9025\b') { throw "$Name emitted a warning; raw logs retained." }
            if ($null -eq $nativeExit -or $nativeExit -ne $ExpectedExit) { throw "$Name native exit $nativeExit; expected $ExpectedExit" }
          }
          try {
            $cmakeInput = Join-Path $env:GITHUB_WORKSPACE 'tests/CMakeLists.txt'
            $headerInput = Join-Path $env:GITHUB_WORKSPACE 'tests/assertions_enabled.hpp'
            $checkout = & git -C $env:GITHUB_WORKSPACE rev-parse HEAD
            $gitExit = $LASTEXITCODE
            if ($gitExit -ne 0 -or $checkout -notmatch '^[0-9a-f]{40}$') { throw 'Checked-out commit could not be identified.' }
            $cmakeHash = (Get-FileHash -LiteralPath $cmakeInput).Hash
            $headerHash = (Get-FileHash -LiteralPath $headerInput).Hash
            $match = [regex]::Match([IO.File]::ReadAllText($cmakeInput), '\Afunction\(nstu_enable_test_assertions target\)\r?\n.*?\r?\nendfunction\(\)', [Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $match.Success) { throw 'Exact first production assertion function not found.' }
            $helperCopy = Join-Path $sourceRoot 'assertion helper.cmake'
            $headerCopy = Join-Path $sourceRoot 'assertions_enabled.hpp'
            [IO.File]::WriteAllText($helperCopy, $match.Value, $utf8NoBom)
            [IO.File]::Copy($headerInput, $headerCopy, $false)
            $helperHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($utf8NoBom.GetBytes($match.Value)))
            if ((Get-FileHash -LiteralPath $helperCopy).Hash -ne $helperHash) { throw 'Copied helper bytes differ.' }
            if ((Get-FileHash -LiteralPath $headerCopy).Hash -ne $headerHash -or (Get-FileHash -LiteralPath $headerInput).Hash -ne $headerHash -or (Get-FileHash -LiteralPath $cmakeInput).Hash -ne $cmakeHash) { throw 'Source/copy provenance changed.' }
            $provenance = @{ checkout = $checkout; sourceCMake = $cmakeInput; sourceCMakeSHA256 = $cmakeHash; sourceHeader = $headerInput; sourceHeaderSHA256 = $headerHash; extractedHelperSHA256 = $helperHash; helperCopy = $helperCopy; headerCopy = $headerCopy }
            [IO.File]::WriteAllText((Join-Path $logRoot 'provenance.json'), ($provenance | ConvertTo-Json), $utf8NoBom)
            $probe = @'
          #include <cassert>
          int main() {
              int n = 0;
              assert(++n == 1);
              return n == 1 ? 0 : 1;
          }
          '@
            [IO.File]::WriteAllText((Join-Path $sourceRoot 'probe.cpp'), $probe, $utf8NoBom)
            $project = @'
          cmake_minimum_required(VERSION 3.25)
          project(NstuAssertionProof LANGUAGES CXX)
          if(NOT CMAKE_CXX_COMPILER_ID STREQUAL "MSVC" OR NOT MSVC OR NOT CMAKE_GENERATOR MATCHES "^Visual Studio")
              message(FATAL_ERROR "Actual MSVC Visual Studio proof required")
          endif()
          message(STATUS "Assertion proof compiler=${CMAKE_CXX_COMPILER_ID}; version=${CMAKE_CXX_COMPILER_VERSION}; path=${CMAKE_CXX_COMPILER}; generator=${CMAKE_GENERATOR}; platform=${CMAKE_GENERATOR_PLATFORM}; toolset=${CMAKE_VS_PLATFORM_TOOLSET}; toolset_version=${CMAKE_VS_PLATFORM_TOOLSET_VERSION}; VS_instance=${CMAKE_GENERATOR_INSTANCE}; VS_build=${CMAKE_VS_VERSION_BUILD_NUMBER}; configuration=Release")
          include("${CMAKE_CURRENT_LIST_DIR}/assertion helper.cmake")
          foreach(target IN ITEMS assertion_negative assertion_positive)
              add_executable(${target} probe.cpp)
              target_compile_features(${target} PRIVATE cxx_std_20)
              target_compile_options(${target} PRIVATE /W4 /WX /permissive-)
          endforeach()
          nstu_enable_test_assertions(assertion_positive)
          '@
            [IO.File]::WriteAllText((Join-Path $sourceRoot 'CMakeLists.txt'), $project, $utf8NoBom)
            # This witness proves expression evaluation; standard <cassert> semantics are independently reviewed.
            $inputs = Get-ChildItem -LiteralPath $sourceRoot -File | Get-FileHash | Select-Object Path, Hash
            [IO.File]::WriteAllText((Join-Path $proofRoot 'input-hashes.json'), ($inputs | ConvertTo-Json), $utf8NoBom)
            Write-Host ($inputs | ConvertTo-Json)
            Invoke-AssertionProofNative -Name configure -Program $cmake -ArgumentList @('-S', $sourceRoot, '-B', $buildRoot, '-G', 'Visual Studio 17 2022', '-A', 'x64', '-DCMAKE_CXX_FLAGS=') -ExpectedExit 0 -CheckWarnings
            foreach ($target in @('assertion_negative', 'assertion_positive')) {
              $projectPath = Join-Path $buildRoot ($target + '.vcxproj')
              [xml]$vs = [IO.File]::ReadAllText($projectPath)
              $release = @($vs.Project.ItemDefinitionGroup | Where-Object { $_.Condition -like '*Release|x64*' })
              if ($release.Count -ne 1) { throw "$target Release x64 settings missing or ambiguous." }
              $compile = $release[0].ClCompile
              if ($compile.WarningLevel -ne 'Level4' -or $compile.TreatWarningAsError -ne 'true' -or $compile.ConformanceMode -ne 'true' -or $compile.LanguageStandard -ne 'stdcpp20') { throw "$target strict MSVC settings drift." }
              if ([string]$compile.PreprocessorDefinitions -notmatch '(^|;)NDEBUG(;|$)') { throw "$target lacks standard Release NDEBUG." }
              $forced = @(([string]$compile.ForcedIncludeFiles).Split(';') | Where-Object { $_ -and $_ -ne '%(ForcedIncludeFiles)' })
              if ($target -eq 'assertion_positive') {
                if ($forced.Count -ne 1 -or [IO.Path]::GetFullPath($forced[0]) -ne [IO.Path]::GetFullPath($headerCopy)) { throw 'Production helper forced-include path not preserved.' }
              } elseif ($forced.Count -ne 0) { throw 'Negative control received a forced include.' }
              Write-Host "$target Release|x64 /W4 /WX /permissive- stdcpp20 NDEBUG; ForcedIncludeFiles=$($compile.ForcedIncludeFiles)"
              Write-Host "$projectPath SHA256=$((Get-FileHash -LiteralPath $projectPath).Hash)"
            }
            Invoke-AssertionProofNative -Name build -Program $cmake -ArgumentList @('--build', $buildRoot, '--config', 'Release', '--target', 'assertion_negative', 'assertion_positive', '--verbose', '--', '/nologo', '/v:normal') -ExpectedExit 0 -CheckWarnings
            Invoke-AssertionProofNative -Name negative -Program (Join-Path $buildRoot 'Release/assertion_negative.exe') -ArgumentList @() -ExpectedExit 1
            Invoke-AssertionProofNative -Name positive -Program (Join-Path $buildRoot 'Release/assertion_positive.exe') -ArgumentList @() -ExpectedExit 0
          } catch {
            [IO.File]::WriteAllText((Join-Path $proofRoot 'failure.txt'), ($_ | Out-String), $utf8NoBom)
            throw
          } finally {
            $retainedText = @(Get-ChildItem -LiteralPath $logRoot -File) + @(Get-ChildItem -LiteralPath $sourceRoot -File) + @(Get-ChildItem -LiteralPath $buildRoot -Filter 'assertion_*.vcxproj' -File -ErrorAction SilentlyContinue)
            foreach ($file in $retainedText) {
              Write-Host "::group::$($file.FullName)"
              Write-Host ([IO.File]::ReadAllText($file.FullName))
              Write-Host '::endgroup::'
            }
          }
      - name: Validate installer and exam assets
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/verify-client-connection.ps1),
            [ref]$null,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          node --check exam/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/exam_web_recovery_tests.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content exam/schema/manifest.schema.json -Raw |
            ConvertFrom-Json | Out-Null
          Get-Content exam/examples/ielts-sample.json -Raw |
            ConvertFrom-Json | Out-Null
          ./packaging/test-installer-firewall-provisioning.ps1
      - name: Trial update state machine
        shell: pwsh
        run: ./packaging/test-update-cycle.ps1
      - name: Trial exam package staging
        shell: pwsh
        run: ./packaging/test-exam-package-staging.ps1
      - name: Package unified installer
        run: cmake --build build --config Release --target nstu-package --parallel
      - name: Verify slimmed installer payload
        shell: pwsh
        run: |
          $stage = 'build\unified-installer-stage'
          # The slimmed installer carries only role binaries, required runtimes,
          # diagnostics, and exam runtime assets: no documentation directory and
          # no PowerShell payload of any kind.
          if (Test-Path (Join-Path $stage 'docs')) {
            throw 'Installer must not package a docs directory.'
          }
          $ps1 = Get-ChildItem -Path $stage -Recurse -Filter *.ps1 -File -ErrorAction SilentlyContinue
          if ($null -ne $ps1) {
            throw "Installer must not package PowerShell scripts: $($ps1.FullName -join ', ')"
          }
          # nstu-provision (the legacy file-copy enrollment tool) is deprecated:
          # UI-driven pairing by room name replaces hand-copied enrollment
          # secrets. The target stays buildable in the repo as a manual fallback
          # but must never ship in the installer payload.
          $provision = Get-ChildItem -Path $stage -Recurse -Filter nstu-provision.exe -File -ErrorAction SilentlyContinue
          if ($null -ne $provision) {
            throw "Installer must not package the deprecated nstu-provision.exe: $($provision.FullName -join ', ')"
          }
          # Role binaries and the exam runtime web assets must be present.
          foreach ($required in @(
              'client\nstu-service.exe',
              'server\nstu-server.exe',
              'client\exam\web\index.html')) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "Required installer payload is missing: $required"
            }
          }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nstu-installers
          path: build/nstu-*.exe
          if-no-files-found: error
          retention-days: 14

  internal-vm-build:
    name: Internal VM test installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Configure internal build
        run: >-
          cmake -S . -B build-internal -A x64
          -DNSTU_ENABLE_WERROR=ON
          -DNSTU_INTERNAL_TEST_BUILD=ON
      - name: Build internal binaries
        run: cmake --build build-internal --config Release --parallel
      - name: Test internal binaries
        run: ctest --test-dir build-internal -C Release --output-on-failure
      - name: Package internal test installer
        run: cmake --build build-internal --config Release --target nstu-package --parallel
      - name: Verify internal label and channel
        shell: pwsh
        run: |
          $installer = Get-ChildItem build-internal -Filter '*-internal-vm-setup.exe' -File
          if ($null -eq $installer) { throw 'Internal installer was not produced.' }
          if ($installer.Name -notmatch 'internal-vm') { throw 'Internal installer label is missing.' }
      - name: Upload internal VM installer
        uses: actions/upload-artifact@v4
        with:
          name: nstu-internal-vm-installer
          path: build-internal/nstu-*-internal-vm-setup.exe
          if-no-files-found: error
          retention-days: 14

  dev-unprotected-build:
    name: DEV unprotected installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Configure DEV unprotected build
        run: >-
          cmake -S . -B build-dev -A x64
          -DNSTU_ENABLE_WERROR=ON
          -DNSTU_DEV_UNPROTECTED_BUILD=ON
      - name: Build DEV binaries
        run: cmake --build build-dev --config Release --parallel
      - name: Test DEV binaries
        run: ctest --test-dir build-dev -C Release --output-on-failure
      - name: Package DEV unprotected installer
        run: cmake --build build-dev --config Release --target nstu-package --parallel
      - name: Verify DEV label and channel
        shell: pwsh
        run: |
          $installer = Get-ChildItem build-dev -Filter '*-dev-unprotected-setup.exe' -File
          if ($null -eq $installer) { throw 'DEV installer was not produced.' }
          if ($installer.Name -notmatch 'dev-unprotected') { throw 'DEV installer label is missing.' }
      - name: Upload DEV unprotected installer
        uses: actions/upload-artifact@v4
        with:
          name: nstu-dev-unprotected-installer
          path: build-dev/nstu-*-dev-unprotected-setup.exe
          if-no-files-found: error
          retention-days: 14

  webview2-host-build:
    name: WebView2-enabled host build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Acquire WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4314.35 -OutputDirectory packages
          $sdk = Resolve-Path "packages/Microsoft.Web.WebView2.1.0.4314.35"
          if (-not (Test-Path "$sdk/build/native/include/WebView2.h")) {
            throw "WebView2 SDK header not found"
          }
          "NSTU_WEBVIEW2_SDK_DIR=$sdk" | Out-File -Append $env:GITHUB_ENV
      - name: Configure with WebView2 host
        run: >-
          cmake -S . -B build-webview2 -A x64
          -DNSTU_ENABLE_WERROR=ON
          -DNSTU_ENABLE_WEBVIEW2_HOST=ON
          -DNSTU_WEBVIEW2_SDK_DIR="${{ env.NSTU_WEBVIEW2_SDK_DIR }}"
      - name: Build
        run: cmake --build build-webview2 --config Release --parallel
      - name: Test
        run: ctest --test-dir build-webview2 -C Release --output-on-failure
      - name: Validate installer and exam assets
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/verify-client-connection.ps1),
            [ref]$null,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          node --check exam/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/exam_web_recovery_tests.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content exam/schema/manifest.schema.json -Raw |
            ConvertFrom-Json | Out-Null
          Get-Content exam/examples/ielts-sample.json -Raw |
            ConvertFrom-Json | Out-Null
          ./packaging/test-installer-firewall-provisioning.ps1
      - name: Install to verification tree
        run: cmake --install build-webview2 --prefix build-webview2/install --config Release
      - name: Verify WebView2 loader
        shell: pwsh
        run: |
          $loader = Get-ChildItem -Path build-webview2 -Recurse -Filter WebView2Loader.dll -File | Select-Object -First 1
          if ($null -eq $loader) {
            throw "WebView2Loader.dll was not found in the build/install tree"
          }
          $sig = Get-AuthenticodeSignature $loader.FullName
          Write-Host "WebView2Loader.dll found at: $($loader.FullName)"
          Write-Host "WebView2Loader.dll signature status: $($sig.Status)"
          Write-Host "WebView2Loader.dll signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Warning "WebView2Loader.dll signature is not valid: $($sig.Status)"
          }

  release:
    name: Development release
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: nstu-installers
          path: nstu-installers
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="nightly-${RUN_NUMBER}"
          title="Project NSTU nightly ${RUN_NUMBER}"
          notes="Automated development release for commit ${COMMIT_SHA}. Built and tested by the Windows CI workflow. This is a pre-release and is not production-ready."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" nstu-installers/*.exe --clobber
            gh release edit "${tag}" --target "${COMMIT_SHA}" \
              --title "${title}" --notes "${notes}" --prerelease
          else
            gh release create "${tag}" nstu-installers/*.exe \
              --target "${COMMIT_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
          fi
