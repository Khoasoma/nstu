name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64 -DNSTU_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install NSIS
        run: choco install nsis --no-progress --yes
      - name: Package server installer
        run: cmake --build build --config Release --target nstu-package-server --parallel
      - name: Package client installer
        run: cmake --build build --config Release --target nstu-package-client --parallel
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nstu-installers
          path: build/nstu-*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Development release
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: nstu-installers
          path: nstu-installers
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="nightly-${RUN_NUMBER}"
          title="Project NSTU nightly ${RUN_NUMBER}"
          notes="Automated development release for commit ${COMMIT_SHA}. Built and tested by the Windows CI workflow. This is a pre-release and is not production-ready."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" nstu-installers/*.exe --clobber
            gh release edit "${tag}" --target "${COMMIT_SHA}" \
              --title "${title}" --notes "${notes}" --prerelease
          else
            gh release create "${tag}" nstu-installers/*.exe \
              --target "${COMMIT_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
          fi
