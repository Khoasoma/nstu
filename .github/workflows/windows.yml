name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Configure
        run: cmake -S . -B build -A x64 -DNSTU_ENABLE_WERROR=ON -DNSTU_INTERNAL_TEST_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate installer and exam assets
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/verify-client-connection.ps1),
            [ref]$null,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          node --check exam/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/exam_web_recovery_tests.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content exam/schema/manifest.schema.json -Raw |
            ConvertFrom-Json | Out-Null
          Get-Content exam/examples/ielts-sample.json -Raw |
            ConvertFrom-Json | Out-Null
          ./packaging/test-installer-firewall-provisioning.ps1
      - name: Trial update state machine
        shell: pwsh
        run: ./packaging/test-update-cycle.ps1
      - name: Trial exam package staging
        shell: pwsh
        run: ./packaging/test-exam-package-staging.ps1
      - name: Package unified installer
        run: cmake --build build --config Release --target nstu-package --parallel
      - name: Verify slimmed installer payload
        shell: pwsh
        run: |
          $stage = 'build\unified-installer-stage'
          # The slimmed installer carries only role binaries, required runtimes,
          # diagnostics, and exam runtime assets: no documentation directory and
          # no PowerShell payload of any kind.
          if (Test-Path (Join-Path $stage 'docs')) {
            throw 'Installer must not package a docs directory.'
          }
          $ps1 = Get-ChildItem -Path $stage -Recurse -Filter *.ps1 -File -ErrorAction SilentlyContinue
          if ($null -ne $ps1) {
            throw "Installer must not package PowerShell scripts: $($ps1.FullName -join ', ')"
          }
          # nstu-provision (the legacy file-copy enrollment tool) is deprecated:
          # UI-driven pairing by room name replaces hand-copied enrollment
          # secrets. The target stays buildable in the repo as a manual fallback
          # but must never ship in the installer payload.
          $provision = Get-ChildItem -Path $stage -Recurse -Filter nstu-provision.exe -File -ErrorAction SilentlyContinue
          if ($null -ne $provision) {
            throw "Installer must not package the deprecated nstu-provision.exe: $($provision.FullName -join ', ')"
          }
          # Role binaries and the exam runtime web assets must be present.
          foreach ($required in @(
              'client\nstu-service.exe',
              'server\nstu-server.exe',
              'client\exam\web\index.html')) {
            if (-not (Test-Path (Join-Path $stage $required))) {
              throw "Required installer payload is missing: $required"
            }
          }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nstu-installers
          path: build/nstu-*.exe
          if-no-files-found: error
          retention-days: 14

  internal-vm-build:
    name: Internal VM test installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Configure internal build
        run: >-
          cmake -S . -B build-internal -A x64
          -DNSTU_ENABLE_WERROR=ON
          -DNSTU_INTERNAL_TEST_BUILD=ON
      - name: Build internal binaries
        run: cmake --build build-internal --config Release --parallel
      - name: Test internal binaries
        run: ctest --test-dir build-internal -C Release --output-on-failure
      - name: Package internal test installer
        run: cmake --build build-internal --config Release --target nstu-package --parallel
      - name: Verify internal label and channel
        shell: pwsh
        run: |
          $installer = Get-ChildItem build-internal -Filter '*-internal-vm-setup.exe' -File
          if ($null -eq $installer) { throw 'Internal installer was not produced.' }
          if ($installer.Name -notmatch 'internal-vm') { throw 'Internal installer label is missing.' }
      - name: Upload internal VM installer
        uses: actions/upload-artifact@v4
        with:
          name: nstu-internal-vm-installer
          path: build-internal/nstu-*-internal-vm-setup.exe
          if-no-files-found: error
          retention-days: 14

  dev-unprotected-build:
    name: DEV unprotected installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Configure DEV unprotected build
        run: >-
          cmake -S . -B build-dev -A x64
          -DNSTU_ENABLE_WERROR=ON
          -DNSTU_DEV_UNPROTECTED_BUILD=ON
      - name: Build DEV binaries
        run: cmake --build build-dev --config Release --parallel
      - name: Test DEV binaries
        run: ctest --test-dir build-dev -C Release --output-on-failure
      - name: Package DEV unprotected installer
        run: cmake --build build-dev --config Release --target nstu-package --parallel
      - name: Verify DEV label and channel
        shell: pwsh
        run: |
          $installer = Get-ChildItem build-dev -Filter '*-dev-unprotected-setup.exe' -File
          if ($null -eq $installer) { throw 'DEV installer was not produced.' }
          if ($installer.Name -notmatch 'dev-unprotected') { throw 'DEV installer label is missing.' }
      - name: Upload DEV unprotected installer
        uses: actions/upload-artifact@v4
        with:
          name: nstu-dev-unprotected-installer
          path: build-dev/nstu-*-dev-unprotected-setup.exe
          if-no-files-found: error
          retention-days: 14

  webview2-host-build:
    name: WebView2-enabled host build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Required current-source regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node -ErrorAction Stop | Out-Null
          node scripts/tests/required-regressions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/tests/verify-required-regressions-tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress --yes
          }
      - name: Acquire WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4314.35 -OutputDirectory packages
          $sdk = Resolve-Path "packages/Microsoft.Web.WebView2.1.0.4314.35"
          if (-not (Test-Path "$sdk/build/native/include/WebView2.h")) {
            throw "WebView2 SDK header not found"
          }
          "NSTU_WEBVIEW2_SDK_DIR=$sdk" | Out-File -Append $env:GITHUB_ENV
      - name: Configure with WebView2 host
        run: >-
          cmake -S . -B build-webview2 -A x64
          -DNSTU_ENABLE_WERROR=ON
          -DNSTU_ENABLE_WEBVIEW2_HOST=ON
          -DNSTU_WEBVIEW2_SDK_DIR="${{ env.NSTU_WEBVIEW2_SDK_DIR }}"
      - name: Build
        run: cmake --build build-webview2 --config Release --parallel
      - name: Test
        run: ctest --test-dir build-webview2 -C Release --output-on-failure
      - name: Validate installer and exam assets
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/verify-client-connection.ps1),
            [ref]$null,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          node --check exam/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/exam_web_recovery_tests.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content exam/schema/manifest.schema.json -Raw |
            ConvertFrom-Json | Out-Null
          Get-Content exam/examples/ielts-sample.json -Raw |
            ConvertFrom-Json | Out-Null
          ./packaging/test-installer-firewall-provisioning.ps1
      - name: Install to verification tree
        run: cmake --install build-webview2 --prefix build-webview2/install --config Release
      - name: Verify WebView2 loader
        shell: pwsh
        run: |
          $loader = Get-ChildItem -Path build-webview2 -Recurse -Filter WebView2Loader.dll -File | Select-Object -First 1
          if ($null -eq $loader) {
            throw "WebView2Loader.dll was not found in the build/install tree"
          }
          $sig = Get-AuthenticodeSignature $loader.FullName
          Write-Host "WebView2Loader.dll found at: $($loader.FullName)"
          Write-Host "WebView2Loader.dll signature status: $($sig.Status)"
          Write-Host "WebView2Loader.dll signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Warning "WebView2Loader.dll signature is not valid: $($sig.Status)"
          }

  release:
    name: Development release
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: nstu-installers
          path: nstu-installers
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="nightly-${RUN_NUMBER}"
          title="Project NSTU nightly ${RUN_NUMBER}"
          notes="Automated development release for commit ${COMMIT_SHA}. Built and tested by the Windows CI workflow. This is a pre-release and is not production-ready."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" nstu-installers/*.exe --clobber
            gh release edit "${tag}" --target "${COMMIT_SHA}" \
              --title "${title}" --notes "${notes}" --prerelease
          else
            gh release create "${tag}" nstu-installers/*.exe \
              --target "${COMMIT_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
          fi
